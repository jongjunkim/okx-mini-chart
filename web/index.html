const ALERT_TFS = ["1m", "5m", "15m", "1h"];
const SOUNDS = ["Glass", "Ping", "Hero", "Submarine", "Funk", "Pop", "Purr", "Tink", "Blow", "Bottle", "Frog", "Morse", "Basso", "Sosumi"];
let alertCfg = (() => {
  try { const v = JSON.parse(store.get("okx.alert", "")); if (v && Array.isArray(v.tfs) && Array.isArray(v.watch)) return v } catch (e) {}
  return { on: false, n: 5, tfs: ["5m", "15m"], slots: true, watch: [], banner: true, sound: true, soundName: "Glass" };
})();
let alertLog = (() => {
  try { const v = JSON.parse(store.get("okx.alert.log", "")); if (Array.isArray(v)) return v } catch (e) {}
  return [];
})();
let alertUnseen = 0, alSugg = [], alSel = 0, watchChain = Promise.resolve();
const watchers = new Map();
const alp = $("alp");

const post = m => { try { window.webkit.messageHandlers.win.postMessage(m); return true } catch (e) { return false } };
const saveAlert = () => store.set("okx.alert", JSON.stringify(alertCfg));
const hm = ms => new Date(ms).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const watchBar = (r, inst) => ({ ts: +r[0], c: +r[4], v: +r[volIdx(inst)] });

function whenStr(ms) {
  const d = new Date(ms).toDateString(), now = Date.now();
  if (d === new Date(now).toDateString()) return hm(ms);
  if (d === new Date(now - 864e5).toDateString()) return "어제 " + hm(ms);
  const t = new Date(ms);
  return `${t.getMonth() + 1}/${t.getDate()} ${hm(ms)}`;
}

function activeMAs() {
  return ind.ma.map((m, k) => ({ ...m, k })).filter(m => m.on).sort((a, b) => a.n - b.n);
}

function maChain(ms) {
  return ms.map((m, i) => i && m.type === ms[i - 1].type ? m.n : m.type + m.n).join(" > ");
}

function needBars() {
  const ms = activeMAs();
  return Math.min(1500, Math.max(300, (ms.length ? ms.at(-1).n : 0) * 3 + alertCfg.n + 10));
}

function alertInsts() {
  if (!alertCfg.on || !alertCfg.tfs.length) return [];
  return [...new Set([...(alertCfg.slots ? slots.map(S => S.inst).filter(Boolean) : []), ...alertCfg.watch])];
}

function refreshWatchers() {
  const want = new Set(alertInsts().flatMap(inst => alertCfg.tfs.map(tf => `${tf}|${inst}`)));
  for (const [k, W] of watchers) {
    if (want.has(k)) continue;
    W.gen++;
    clearTimeout(W.retryT);
    watchers.delete(k);
  }
  for (const k of want) {
    if (watchers.has(k)) continue;
    const [tf, inst] = k.split("|");
    const W = { tf, inst, bars: [], gen: 0, ready: false, full: false, lastEval: 0, catching: false, retryT: null };
    watchers.set(k, W);
    queueLoad(W);
  }
  const insts = alertInsts();
  for (const S of slots) {
    const on = !!S.inst && insts.includes(S.inst);
    S.el.classList.toggle("watched", on);
    S.bellEl.title = on ? `정배열 알림 감시 중 (${alertCfg.tfs.join("·")})` : "";
  }
}

function queueLoad(W) {
  watchChain = watchChain.then(() => loadWatcher(W)).catch(() => {});
}

function topUpWatchers() {
  for (const W of watchers.values()) if (W.ready && !W.full && W.bars.length < needBars()) queueLoad(W);
}

async function loadWatcher(W) {
  const g = ++W.gen;
  clearTimeout(W.retryT);
  try {
    const rows = (await getJson(`${API}/market/candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&limit=300`)).filter(r => r[8] === "1");
    let bars = rows.reverse().map(r => watchBar(r, W.inst)), full = false;
    while (g === W.gen && bars.length && bars.length < needBars()) {
      await new Promise(r => setTimeout(r, 200));
      const older = (await getJson(`${API}/market/history-candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&after=${bars[0].ts}&limit=300`))
        .reverse().map(r => watchBar(r, W.inst)).filter(b => b.ts < bars[0].ts);
      if (!older.length) { full = true; break }
      bars = older.concat(bars);
    }
    if (g !== W.gen) return;
    W.bars = bars;
    W.full = full;
    W.lastEval = Math.max(W.lastEval, bars.at(-1)?.ts || 0);
    W.ready = true;
  } catch (e) {
    if (g === W.gen) W.retryT = setTimeout(() => { if (watchers.get(`${W.tf}|${W.inst}`) === W) queueLoad(W) }, 30000);
  }
}

function onWatchBar(W, r) {
  const ts = +r[0], last = W.bars.at(-1), iv = SEC[W.tf] * 1000;
  if (r[8] !== "1") { if (last && ts > last.ts + iv) catchUp(W); return }
  if (last && ts <= last.ts) return;
  if (last && ts > last.ts + iv) { catchUp(W); return }
  W.bars.push(watchBar(r, W.inst));
  trimWatcher(W);
  evalWatcher(W);
}

function trimWatcher(W) {
  const keep = needBars() + 200;
  if (W.bars.length > keep) W.bars.splice(0, W.bars.length - keep);
}

async function catchUp(W) {
  if (W.catching || !W.ready) return;
  W.catching = true;
  const g = W.gen;
  try {
    const rows = (await getJson(`${API}/market/candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&limit=20`)).filter(r => r[8] === "1").reverse();
    if (g !== W.gen) return;
    const last = W.bars.at(-1), add = rows.map(r => watchBar(r, W.inst)).filter(b => !last || b.ts > last.ts);
    if (!add.length) return;
    if (last && add[0].ts > last.ts + SEC[W.tf] * 1000) { queueLoad(W); return }
    W.bars.push(...add);
    trimWatcher(W);
    evalWatcher(W);
  } catch (e) {
  } finally {
    W.catching = false;
  }
}

function alignedAt(lines, i, n) {
  for (let j = 0; j < lines.length; j++) {
    const v = lines[j][i], p = lines[j][i - n];
    if (v == null || p == null || !(v > p)) return false;
    if (j && !(lines[j - 1][i] > v)) return false;
  }
  return true;
}

function evalWatcher(W) {
  const ms = activeMAs(), i = W.bars.length - 1;
  if (ms.length < 2 || i <= alertCfg.n) return;
  const ts = W.bars[i].ts;
  if (ts <= W.lastEval) return;
  W.lastEval = ts;
  const cl = W.bars.map(b => b.c), vl = W.bars.map(b => b.v);
  const lines = ms.map(m => m.type === "EMA" ? ema(cl, m.n) : m.type === "VWMA" ? vwma(cl, vl, m.n) : sma(cl, m.n));
  if (alignedAt(lines, i, alertCfg.n) && !alignedAt(lines, i - 1, alertCfg.n)) fireAlert(W, ms, cl[i], ts);
}

function fireAlert(W, ms, close, ts) {
  const at = ts + SEC[W.tf] * 1000, px = close.toLocaleString("en-US", { maximumSignificantDigits: 6 });
  alertLog.unshift({ inst: W.inst, tf: W.tf, ts, at, px });
  alertLog.length = Math.min(alertLog.length, 30);
  store.set("okx.alert.log", JSON.stringify(alertLog));
  const title = `${W.inst} · ${W.tf} 정배열`;
  post({ notify: {
    title, body: `${maChain(ms)}, 모두 ${alertCfg.n}봉 전보다 위\n${hm(at)} 봉 마감 · 종가 ${px}`,
    inst: W.inst, tf: W.tf, banner: !!alertCfg.banner, sound: alertCfg.sound ? alertCfg.soundName : ""
  } });
  showToast(`${title} · ${hm(at)} 봉 마감 · ${px}`, false);
  if (alp.classList.contains("open")) renderAlertPanel();
  else { alertUnseen++; updateAlertBadge() }
  slotsOf(W.inst).forEach(updateMarkers);
}

function updateMarkers(S) {
  if (!S.inst || !S.bars.length) { S.candle.setMarkers([]); return }
  const times = new Set(alertLog.filter(e => e.inst === S.inst && e.tf === S.tf).map(e => Math.floor(e.ts / 1000) + TZ)
    .filter(t => idxOfTime(S.bars, t) >= 0));
  const ms = [...times].map(t => ({
    time: t, position: "belowBar", color: C("--draw"), shape: "arrowUp", text: "정배열 " + hm((t - TZ + SEC[S.tf]) * 1000)
  }));
  for (const m of S.rp ? S.bt?.marks || [] : []) {
    const i = barAt(S, m.t);
    if (i >= 0) ms.push({
    time: S.bars[i].time, position: m.dir > 0 ? "belowBar" : "aboveBar", color: m.dir > 0 ? C("--up") : C("--down"), shape: m.dir > 0 ? "arrowUp" : "arrowDown", text: m.text
    });
  }
  S.candle.setMarkers(ms.sort((a, b) => a.time - b.time));
}

function updateAlertBadge() {
  $("alBadge").textContent = alertUnseen > 9 ? "9+" : alertUnseen;

window.openAlert = (inst, tf) => {
  if (!inst) return;
  closeAlertPanel();
  let S = slots.find(x => x.inst === inst && x.tf === tf) || slots.find(x => x.inst === inst);
  if (!S) S = activeSlot && slots.includes(activeSlot) ? activeSlot : slots[0];
  const change = S.inst !== inst || (BARS.includes(tf) && S.tf !== tf);
  if (change) {
    if (selectedInst === S.inst) select(null);
    S.inst = inst;
    if (BARS.includes(tf)) { S.tf = tf; S.tfEl.value = tf; S.chart.applyOptions({ timeScale: { timeVisible: tf !== "1d" } }) }
    saveSlots();
    loadSlot(S);
    syncSubs();
  }
  activeSlot = S;
  if (S.collapsed) setCollapsed(S, false);
  S.el.scrollIntoView({ block: "nearest" });
};

function watchdog() {
  const now = Date.now();
  for (const W of watchers.values()) {
    const last = W.bars.at(-1);
    if (W.ready && last && now >= last.ts + 2 * SEC[W.tf] * 1000 + 3000) catchUp(W);
  }
}

const MAKER = 0.0002, TAKER = 0.0005, TRADE_W = 250, STRIP_W = 24, DOCK_H = 190, HIST_MAX = 300;
const WS_PUB = "wss://ws.okx.com/ws/v5/public";
const tr = { on: store.get("okx.trade.on", "") === "1", fold: store.get("okx.trade.fold", "") === "1", tab: "pos", unit: "coin", otype: "limit", inst: null, newInst: false, editing: null, menu: null, sig: {}, dirty: false, caught: 0, funding: false };
const specs = {}, specP = {}, specErr = {}, quotes = {};
let acct = loadAcct(), tws = null, tsubs = new Set(), tpingT = null, treconT = null, catching = false, tdrag = null, resetT = null;

function freshAcct() {
  return { cash: 0, dep: 0, pos: {}, orders: [], hist: [], cfg: {}, seenAt: 0, nextId: 1 };
}

function loadAcct() {
  try {
    const v = JSON.parse(store.get("okx.paper", ""));
    if (v && typeof v.cash === "number" && v.pos && Array.isArray(v.orders)) return { ...freshAcct(), ...v };
  } catch (e) {}
  return freshAcct();
}

function saveAcct() {
  if (!Object.keys(acct.pos).length && !acct.orders.length) acct.seenAt = Date.now();
  acct.hist.sort((a, b) => b.t - a.t);
  if (acct.hist.length > HIST_MAX) acct.hist.length = HIST_MAX;
  store.set("okx.paper", JSON.stringify(acct));
  tr.dirty = false;
}

function tradeInstOf(inst) {
  if (!inst || /-\d{6}$/.test(inst)) return null;
  if (/-SWAP$/.test(inst)) return inst;
  const [a, b] = inst.split("-");
  return a && b ? `${a}-${b}-SWAP` : null;
}

const decs = s => (String(s).split(".")[1] || "").length;

function loadSpec(inst) {
  if (!inst) return Promise.resolve(null);
  if (specs[inst]) return Promise.resolve(specs[inst]);
  if (specP[inst]) return specP[inst];
  return specP[inst] = (async () => {
    try {
      const d = (await getJson(`${API}/public/instruments?instType=SWAP&instId=${inst}`))[0];
      if (!d) throw new Error("x");
      if (d.ctType !== "linear") { specErr[inst] = { msg: "코인 마진(인버스) 무기한은 가상 거래를 지원하지 않아요", at: Infinity }; return null }
      let tiers = [];
      try {
        tiers = (await getJson(`${API}/public/position-tiers?instType=SWAP&tdMode=cross&instFamily=${d.instFamily}`))
          .map(t => ({ max: +t.maxSz, mmr: +t.mmr })).sort((a, b) => a.max - b.max);
      } catch (e) {}
      const ct = +d.ctVal, qprec = Math.min(8, decs(d.lotSz) + decs(d.ctVal));
      delete specErr[inst];
      return specs[inst] = {
        ct, qprec, ccy: d.ctValCcy || inst.split("-")[0], lot: +(+d.lotSz * ct).toFixed(qprec), min: +(+d.minSz * ct).toFixed(qprec),
        tick: +d.tickSz, prec: decs(d.tickSz), maxLev: Math.max(1, Math.floor(+d.lever || 1)), tiers
      };
    } catch (e) {
      specErr[inst] = { msg: /doesn't exist|^x$/i.test(e.message) ? `${inst} 무기한 선물이 없어 가상 거래를 할 수 없어요` : `종목 정보를 받지 못했어요 · ${e.message}`, at: Date.now() };
      return null;
    } finally {
      delete specP[inst];
    }
  })();
}

const usd = v => (Math.abs(v) < 0.005 ? 0 : v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const susd = v => (v >= 0 ? "+" : "−") + usd(Math.abs(v));
const num = v => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? n : NaN };
const dirName = d => d > 0 ? "롱" : "숏";
const sideName = d => d > 0 ? "매수" : "매도";
const kindName = k => k === "limit" ? "지정가" : k === "stop" ? "스톱" : "시장가";

function tpf(inst, v) {
  if (v == null || !Number.isFinite(v)) return "-";
  const s = specs[inst];
  return s ? v.toLocaleString("en-US", { minimumFractionDigits: s.prec, maximumFractionDigits: s.prec }) : v.toLocaleString("en-US", { maximumSignificantDigits: 6 });
}

const tqf = (inst, q) => specs[inst] ? (+q).toFixed(specs[inst].qprec) : String(+(+q).toFixed(8));
const roundQ = (inst, q) => { const s = specs[inst]; return s ? +(Math.floor(q / s.lot + 1e-9) * s.lot).toFixed(s.qprec) : q };
const roundP = (inst, p) => { const s = specs[inst]; return s ? +(Math.round(p / s.tick) * s.tick).toFixed(s.prec) : p };

const posList = () => Object.values(acct.pos);
const crossPos = () => posList().filter(p => p.mode === "cross");
const lastOf = inst => quotes[inst]?.last;
const markOf = inst => quotes[inst]?.mark || quotes[inst]?.last;
const upnlAt = (p, price) => p.dir * (price - p.entry) * p.qty;
const upnl = p => { const m = markOf(p.inst); return m ? upnlAt(p, m) : 0 };
const posIM = p => p.mode === "isolated" ? p.margin : p.qty * (markOf(p.inst) || p.entry) / p.lev;
const isoMargin = () => posList().reduce((s, p) => s + (p.mode === "isolated" ? p.margin : 0), 0);
const frozenSum = () => acct.orders.reduce((s, o) => s + o.frozen, 0);
const equity = () => acct.cash + posList().reduce((s, p) => s + upnl(p), 0);
const availBal = () => acct.cash - isoMargin() - frozenSum() + crossPos().reduce((s, p) => s + upnl(p) - posIM(p), 0);
const openQty = (inst, dir, qty) => { const p = acct.pos[inst]; return p && p.dir !== dir ? Math.max(0, qty - p.qty) : qty };

function mmrOf(inst, qty) {
  const s = specs[inst];
  if (!s || !s.tiers.length) return 0.005;
  const c = qty / s.ct;
  return (s.tiers.find(t => c <= t.max) || s.tiers.at(-1)).mmr;
}

function liqPx(p) {
  const q = p.qty, mmr = mmrOf(p.inst, q);
  let v;
  if (p.mode === "isolated") v = p.dir > 0 ? (p.entry * q - p.margin) / (q * (1 - mmr)) : (p.entry * q + p.margin) / (q * (1 + mmr));
  else {
    const others = crossPos().filter(x => x !== p);
    const base = acct.cash - isoMargin() + others.reduce((s, x) => s + upnl(x), 0);
    const mmo = others.reduce((s, x) => s + mmrOf(x.inst, x.qty) * x.qty * (markOf(x.inst) || x.entry), 0);
    v = (mmo - base + p.dir * q * p.entry) / (q * (p.dir - mmr));
  }
  return v > 0 && Number.isFinite(v) ? v : null;
}

function tCfg(inst) {
  const c = acct.cfg[inst] || {}, max = specs[inst]?.maxLev || 100;
  return { lev: Math.max(1, Math.min(max, Math.round(c.lev || 10))), mode: c.mode === "cross" ? "cross" : "isolated" };
}

function lockedCfg(inst) {
  const p = acct.pos[inst];
  if (p) return { lev: p.lev, mode: p.mode };
  const o = acct.orders.find(x => x.inst === inst);
  return o ? { lev: o.lev, mode: o.mode } : null;
}

const effCfg = inst => lockedCfg(inst) || tCfg(inst);

function tSay(msg) { showToast(msg, false); return false }

function tNotify(title, body, inst, sound, bg) {
  if (catching) { tr.caught++; return }
  showToast(`${title} · ${body}`, false);
  if (bg) post({ notify: { title, body, inst, tf: "", banner: true, sound } });
}

function tHist(r) { acct.hist.unshift({ t: Date.now(), ...r }) }

function tFill(inst, dir, qty, price, rate, why, o) {
  let p = acct.pos[inst], closed = 0, pnl = 0, rest = qty;
  const fee = price * qty * rate, same = !!p && p.dir === dir;
  acct.cash -= fee;
  if (p && p.dir !== dir) {
    closed = Math.min(rest, p.qty);
    pnl = p.dir * (price - p.entry) * closed;
    acct.cash += pnl;
    if (p.mode === "isolated") p.margin -= p.margin * closed / p.qty;
    p.qty = +(p.qty - closed).toFixed(10);
    rest = +(rest - closed).toFixed(10);
    if (p.qty <= 1e-12) { delete acct.pos[inst]; p = null }
  }
  if (rest > 1e-12) {
    if (!p) p = acct.pos[inst] = { inst, dir, qty: 0, entry: price, lev: o.lev, mode: o.mode, margin: 0, tp: null, sl: null, at: Date.now(), fundAt: Date.now() };
    p.entry = (p.entry * p.qty + price * rest) / (p.qty + rest);
    p.qty = +(p.qty + rest).toFixed(10);
    if (p.mode === "isolated") p.margin += price * rest / p.lev;
  }
  if (p && p.dir === dir) {
    if (o.tp != null) p.tp = o.tp;
    if (o.sl != null) p.sl = o.sl;
  }
  const act = closed && rest > 1e-12 ? `${dirName(-dir)}→${dirName(dir)} 뒤집기` : closed ? `${dirName(-dir)} ${p ? "일부 닫기" : "닫기"}` : `${dirName(dir)} ${same ? "늘리기" : "열기"}`;
  tHist({ inst, why, act, dir, px: price, qty, fee, pnl: closed ? pnl : null });
  return { pnl, fee };
}

function tClose(p, price, why, qty, bg) {
  const s = specs[p.inst], inst = p.inst, dir = p.dir, q = qty || p.qty;
  const r = tFill(inst, -dir, q, price, TAKER, why, { lev: p.lev, mode: p.mode });
  tNotify(`${inst} ${why === "수동" ? "청산" : why + " 체결"}`, `${dirName(dir)} ${tqf(inst, q)} ${s?.ccy || ""} 닫기 @ ${tpf(inst, price)} · 손익 ${susd(r.pnl - r.fee)} USDT`, inst, why === "TP" ? "Glass" : "Basso", bg);
}

function tLiquidate(p, price) {
  delete acct.pos[p.inst];
  acct.cash -= p.margin;
  tHist({ inst: p.inst, why: "강제 청산", act: `${dirName(p.dir)} 닫기 (격리)`, dir: -p.dir, px: price, qty: p.qty, fee: 0, pnl: -p.margin });
  tNotify(`${p.inst} 강제 청산`, `${dirName(p.dir)} ${p.lev}x 포지션이 청산가 ${tpf(p.inst, price)}에 닿아 증거금 ${usd(p.margin)} USDT를 잃었어요`, p.inst, "Basso", true);
}

function checkCross() {
  const cp = crossPos();
  if (!cp.length || cp.some(p => !markOf(p.inst))) return;
  const eq = acct.cash - isoMargin() + cp.reduce((s, p) => s + upnl(p), 0);
  const mm = cp.reduce((s, p) => s + mmrOf(p.inst, p.qty) * p.qty * markOf(p.inst), 0);
  if (eq > mm) return;
  acct.orders.length = 0;
  for (const p of cp) {
    const m = markOf(p.inst), pnl = upnlAt(p, m);
    acct.cash += pnl;
    delete acct.pos[p.inst];
    tHist({ inst: p.inst, why: "강제 청산", act: `${dirName(p.dir)} 닫기 (교차)`, dir: -p.dir, px: m, qty: p.qty, fee: 0, pnl });
  }
  const pen = Math.max(0, acct.cash - isoMargin());
  acct.cash -= pen;
  if (pen) tHist({ inst: "", why: "청산 수수료", act: "남은 교차 증거금", dir: 0, px: null, qty: null, fee: 0, pnl: -pen });
  tNotify("교차 포지션 강제 청산", `총자산이 유지증거금 아래로 내려가 교차 포지션 ${cp.length}개를 모두 닫고 미체결 주문을 취소했어요`, cp[0].inst, "Basso", true);
  saveAcct();
  syncTradeSubs();
}

function tpslError(dir, ref, tp, sl, what) {
  if (tp != null && !(dir > 0 ? tp > ref : tp < ref)) return `TP는 ${what}보다 ${dir > 0 ? "위" : "아래"}여야 해요`;
  if (sl != null && !(dir > 0 ? sl < ref : sl > ref)) return `SL은 ${what}보다 ${dir > 0 ? "아래" : "위"}여야 해요`;
  return null;
}

function tPlace(inst, side, kind, price, qty, tp, sl) {
  const s = specs[inst], last = lastOf(inst), dir = side === "buy" ? 1 : -1;
  if (!s) return tSay(specErr[inst]?.msg || "종목 정보를 받는 중이에요 · 잠시 뒤 다시 눌러 주세요");
  if (!last) return tSay("시세를 받는 중이에요 · 잠시 뒤 다시 눌러 주세요");
  qty = roundQ(inst, qty);
  const op = acct.pos[inst];
  if (op && op.dir !== dir && Math.abs(qty - op.qty) < s.min) qty = op.qty;
  if (!(qty >= s.min) || qty <= 0) return tSay(`최소 주문 수량은 ${tqf(inst, s.min)} ${s.ccy}예요`);
  if (kind !== "market") {
    price = roundP(inst, price);
    if (!(price > 0)) return tSay("가격을 넣어 주세요");
  }
  if (kind === "stop" && (dir > 0 ? last >= price : last <= price)) return tSay(`스톱 ${dir > 0 ? "매수는 현재가보다 위" : "매도는 현재가보다 아래"}에 걸어야 해요`);
  const at = kind === "market" ? last : price;
  const bad = tpslError(dir, at, tp, sl, kind === "market" ? "현재가" : "주문 가격");
  if (bad) return tSay(bad);
  const c = effCfg(inst), oq = openQty(inst, dir, qty), av = availBal();
  const need = at * oq / c.lev + at * qty * TAKER;
  if (oq > 0 && need > av + 1e-9) {
    if (acct.dep) return tSay(`증거금이 모자라요 · 필요 ${usd(need)} / 가능 ${usd(Math.max(0, av))} USDT`);
    if (!tr.on) setTrade(true, true);
    tr.tab = "assets";
    tDock();
    $("dFundIn").focus();
    return tSay("시드머니를 먼저 충전하세요 · 자산 탭을 열었어요");
  }
  if (kind === "market" || (kind === "limit" && (dir > 0 ? price >= last : price <= last))) {
    tFill(inst, dir, qty, last, TAKER, kindName(kind), { ...c, tp, sl });
    tNotify(`${inst} 체결`, `${kindName(kind)} ${sideName(dir)} ${tqf(inst, qty)} ${s.ccy} @ ${tpf(inst, last)}`, inst, "Pop", false);
  } else {
    acct.orders.push({ id: acct.nextId++, inst, dir, kind, px: price, qty, lev: c.lev, mode: c.mode, tp, sl, frozen: price * oq / c.lev, at: Date.now() });
    tSay(`${kindName(kind)} ${sideName(dir)} ${tqf(inst, qty)} ${s.ccy} @ ${tpf(inst, price)} 주문을 넣었어요`);
  }
  saveAcct();
  syncTradeSubs();
  tRender();
  return true;
}

function tFillOrder(o, price, rate) {
  acct.orders.splice(acct.orders.indexOf(o), 1);
  const p = acct.pos[o.inst], lev = p && p.dir === o.dir ? p.lev : o.lev, oq = openQty(o.inst, o.dir, o.qty), s = specs[o.inst];
  if (oq > 0 && price * oq / lev > availBal() + 1e-9) {
    tHist({ inst: o.inst, why: "주문 취소", act: "증거금 부족", dir: o.dir, px: o.px, qty: o.qty, fee: 0, pnl: null });
    tNotify(`${o.inst} 주문 취소`, `증거금이 모자라 ${kindName(o.kind)} ${sideName(o.dir)} ${tqf(o.inst, o.qty)} 주문을 취소했어요`, o.inst, "Basso", true);
    return;
  }
  tFill(o.inst, o.dir, o.qty, price, rate, kindName(o.kind), o);
  tNotify(`${o.inst} ${kindName(o.kind)} 체결`, `${sideName(o.dir)} ${tqf(o.inst, o.qty)} ${s?.ccy || ""} @ ${tpf(o.inst, price)}`, o.inst, "Pop", true);
}

function orderHit(o, lo, hi) {
  return o.kind === "limit" ? (o.dir > 0 ? lo <= o.px : hi >= o.px) : (o.dir > 0 ? hi >= o.px : lo <= o.px);
}

function tEval(inst) {
  if (catching) return;
  const last = lastOf(inst), mark = markOf(inst);
  if (!last) return;
  let changed = false;
  for (const o of acct.orders.filter(x => x.inst === inst)) {
    if (!orderHit(o, last, last)) continue;
    tFillOrder(o, o.kind === "limit" ? o.px : last, o.kind === "limit" ? MAKER : TAKER);
    changed = true;
  }
  const p = acct.pos[inst];
  if (p) {
    const liq = p.mode === "isolated" ? liqPx(p) : null, adverse = (v, x) => v != null && (p.dir > 0 ? x <= v : x >= v);
    if (liq && adverse(liq, mark)) { tLiquidate(p, mark); changed = true }
    else if (adverse(p.sl, last)) { tClose(p, last, "SL", 0, true); changed = true }
    else if (p.tp != null && (p.dir > 0 ? last >= p.tp : last <= p.tp)) { tClose(p, last, "TP", 0, true); changed = true }
  }
  if (changed) { saveAcct(); syncTradeSubs() }
  checkCross();
  acct.seenAt = Date.now();
  tr.dirty = true;
}

function tBar(inst, b) {
  for (const o of acct.orders.filter(x => x.inst === inst && x.at <= b.ts)) {
    if (!orderHit(o, b.l, b.h)) continue;
    const gap = o.dir > 0 ? Math.max(o.px, b.o) : Math.min(o.px, b.o);
    tFillOrder(o, o.kind === "limit" ? o.px : gap, o.kind === "limit" ? MAKER : TAKER);
  }
  const p = acct.pos[inst];
  if (!p || p.at > b.ts) return;
  const worst = p.dir > 0 ? b.l : b.h, best = p.dir > 0 ? b.h : b.l, liq = p.mode === "isolated" ? liqPx(p) : null;
  const adverse = v => v != null && (p.dir > 0 ? worst <= v : worst >= v);
  const gap = v => p.dir > 0 ? Math.min(v, b.o) : Math.max(v, b.o);
  if (adverse(p.sl) && !(liq && (p.dir > 0 ? p.sl <= liq : p.sl >= liq))) tClose(p, gap(p.sl), "SL", 0, true);
  else if (adverse(liq)) tLiquidate(p, liq);
  else if (p.tp != null && (p.dir > 0 ? best >= p.tp : best <= p.tp)) tClose(p, p.dir > 0 ? Math.max(p.tp, b.o) : Math.min(p.tp, b.o), "TP", 0, true);
}

async function fetch1m(inst, since) {
  const from = Math.max(since, Date.now() - 7 * 864e5);
  let rows = await getJson(`${API}/market/candles?instId=${inst}&bar=1m&limit=300`);
  for (let i = 0; i < 40 && rows.length && +rows.at(-1)[0] > from; i++) {
    await new Promise(r => setTimeout(r, 120));
    const page = await getJson(`${API}/market/history-candles?instId=${inst}&bar=1m&after=${rows.at(-1)[0]}&limit=300`);
    if (!page.length) break;
    rows = rows.concat(page);
  }
  return rows.map(r => ({ ts: +r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4] })).filter(b => b.ts >= from).reverse();
}

async function tCatchUp() {
  if (catching) return;
  const since = acct.seenAt, insts = [...new Set([...Object.keys(acct.pos), ...acct.orders.map(o => o.inst)])];
  if (since && insts.length && Date.now() - since > 5000) {
    catching = true;
    tr.caught = 0;
    let ok = true;
    try {
      for (const inst of insts) {
        if (!await loadSpec(inst)) continue;
        for (const b of await fetch1m(inst, since)) tBar(inst, b);
      }
    } catch (e) {
      ok = false;
    } finally {
      catching = false;
    }
    if (ok) acct.seenAt = Date.now();
    saveAcct();
    if (!ok) tSay("앱이 꺼져 있던 동안의 체결 판정을 하지 못했어요 · 네트워크를 확인하세요");
    else if (tr.caught) tSay(`앱이 꺼져 있던 동안 ${tr.caught}건 체결됐어요 · 체결 내역에서 확인하세요`);
  }
  await tFunding();
  for (const inst of Object.keys(quotes)) tEval(inst);
  syncTradeSubs();
  tRender();
}

async function tFunding() {
  if (tr.funding || !posList().length) return;
  tr.funding = true;
  try {
    for (const p of posList()) {
      try {
        const rows = (await getJson(`${API}/public/funding-rate-history?instId=${p.inst}&limit=20`))
          .map(r => ({ t: +r.fundingTime, rate: +(r.realizedRate || r.fundingRate) })).sort((a, b) => a.t - b.t);
        for (const r of rows) {
          if (acct.pos[p.inst] !== p || r.t <= p.fundAt || r.t > Date.now() || !Number.isFinite(r.rate)) continue;
          const amt = r.rate * p.qty * (markOf(p.inst) || p.entry);
          acct.cash -= p.dir * amt;
          acct.hist.unshift({ t: r.t, inst: p.inst, why: "펀딩비", act: `${dirName(p.dir)} · ${(r.rate * 100).toFixed(4)}%`, dir: 0, px: null, qty: p.qty, fee: 0, pnl: -p.dir * amt });
          p.fundAt = r.t;
        }
      } catch (e) {}
    }
    saveAcct();
  } finally {
    tr.funding = false;
  }
}

function tWanted() {
  const s = new Set([...Object.keys(acct.pos), ...acct.orders.map(o => o.inst)]);
  if (tr.inst) s.add(tr.inst);
  return s;
}

function syncTradeSubs() {
  const insts = tWanted();
  if (!tws) { if (insts.size) tconnect(); return }
  if (tws.readyState !== 1) return;
  const want = new Set([...insts].flatMap(i => [`tickers|${i}`, `mark-price|${i}`]));
  const arg = k => { const [channel, instId] = k.split("|"); return { channel, instId } };
  const add = [...want].filter(k => !tsubs.has(k)), del = [...tsubs].filter(k => !want.has(k));
  if (del.length) tws.send(JSON.stringify({ op: "unsubscribe", args: del.map(arg) }));
  if (add.length) tws.send(JSON.stringify({ op: "subscribe", args: add.map(arg) }));
  tsubs = want;
}

function tconnect() {
  clearTimeout(treconT);
  const s = tws = new WebSocket(WS_PUB);
  tsubs = new Set();
  s.onopen = () => {
    syncTradeSubs();
    tCatchUp();
    tpingT = setInterval(() => s.readyState === 1 && s.send("ping"), 20000);
  };
  s.onmessage = e => {
    if (e.data === "pong") return;
    const m = JSON.parse(e.data);
    if (!m.data || !m.arg || !m.data.length) return;
    const inst = m.arg.instId, q = quotes[inst] || (quotes[inst] = {}), d = m.data.at(-1);
    if (m.arg.channel === "tickers") q.last = +d.last;
    else if (m.arg.channel === "mark-price") q.mark = +d.markPx;
    else return;
    tEval(inst);
  };
  s.onclose = () => {
    if (tws !== s) return;
    clearInterval(tpingT);
    tws = null;
    treconT = setTimeout(() => { if (tWanted().size) tconnect() }, 3000);
  };
  s.onerror = () => s.close();
}

async function tTicker(inst) {
  try {
    const t = (await getJson(`${API}/market/ticker?instId=${inst}`))[0];
    const q = quotes[inst] || (quotes[inst] = {});
    if (t && !q.last) q.last = +t.last;
    tRender();
  } catch (e) {}
}

function tLines(inst) {
  if (!inst) return [];
  const out = [], p = acct.pos[inst], dragged = k => tdrag && tdrag.inst === inst && tdrag.key === k ? tdrag.price : null;
  for (const o of acct.orders) {
    if (o.inst !== inst) continue;
    const k = "o" + o.id;
    out.push({ key: k, price: dragged(k) ?? o.px, color: o.dir > 0 ? C("--up") : C("--down"), dash: [2, 3], label: `${kindName(o.kind)} ${sideName(o.dir)} ${tqf(inst, o.qty)}`, x: true, drag: true });
  }
  if (p) {
    const liq = liqPx(p);
    if (liq) out.push({ key: "liq", price: liq, color: LOSS, dash: [1, 3], label: "청산가" });
    for (const k of ["sl", "tp"]) {
      const v = dragged(k) ?? p[k];
      if (v == null) continue;
      const pnl = upnlAt(p, v);
      out.push({ key: k, price: v, color: k === "tp" ? PROFIT : LOSS, dash: [6, 4], label: k.toUpperCase(), sub: `${susd(pnl)} USDT`, subColor: pnl >= 0 ? PROFIT : LOSS, x: true, drag: true });
    }
    const u = upnl(p), roe = u / (p.mode === "isolated" ? p.margin : p.qty * p.entry / p.lev) * 100;
    out.push({ key: "entry", price: p.entry, color: ENTRY, dash: [], label: `${dirName(p.dir)} ${p.lev}x · ${tqf(inst, p.qty)} ${specs[inst]?.ccy || ""}`, sub: `${susd(u)} (${roe >= 0 ? "+" : "−"}${Math.abs(roe).toFixed(2)}%)`, subColor: u >= 0 ? PROFIT : LOSS });
  }
  return out;
}

class TradeLayer {
  constructor(S) {
    this.S = S;
    this.view = { renderer: () => ({ draw: target => this.draw(target) }) };
  }
  attached({ requestUpdate }) { this.requestUpdate = requestUpdate }
  detached() { this.requestUpdate = null }
  updateAllViews() {}
  paneViews() { return [this.view] }
  draw(target) {
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
      const S = this.S, W = mediaSize.width, H = mediaSize.height;
      S.thits = [];
      if (S.rp || !S.inst) return;
      const inst = tradeInstOf(S.inst), font = "-apple-system, BlinkMacSystemFont, sans-serif";
      const placed = [];
      let up = 0, dn = 0;
      ctx.save();
      ctx.textBaseline = "middle";
      for (const L of tLines(inst)) {
        let y = S.candle.priceToCoordinate(L.price);
        if (y == null) continue;
        let edge = "";
        if (y < 6) { edge = "↑ "; y = 46 + 20 * up++ }
        else if (y > H - 6) { edge = "↓ "; y = H - 12 - 20 * dn++ }
        else {
          const yy = Math.round(y) + 0.5;
          ctx.strokeStyle = L.color;
          ctx.lineWidth = L.key === "entry" ? 1.5 : 1.2;
          ctx.setLineDash(L.dash);
          ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
          ctx.setLineDash([]);
        }
        const label = edge + L.label + (edge ? " " + tpf(inst, L.price) : "");
        let x = placed.reduce((m, t) => Math.abs(t.y - y) < 17 ? Math.max(m, t.x2 + 4) : m, 6);
        const x0 = x;
        ctx.font = `600 11px ${font}`;
        const w = ctx.measureText(label).width + 10;
        ctx.fillStyle = L.color;
        ctx.fillRect(x, y - 8.5, w, 17);
        ctx.fillStyle = "#0f1115";
        ctx.fillText(label, x + 5, y + 0.5);
        x += w;
        if (L.sub) {
          ctx.font = `11px ${font}`;
          const sw = ctx.measureText(L.sub).width + 10;
          ctx.fillStyle = "#161a21e6";
          ctx.fillRect(x, y - 8.5, sw, 17);
          ctx.fillStyle = L.subColor || L.color;
          ctx.fillText(L.sub, x + 5, y + 0.5);
          x += sw;
        }
        const hit = { key: L.key, y: edge ? null : y, drag: !!L.drag && !edge };
        if (L.x) {
          ctx.fillStyle = "#161a21e6";
          ctx.fillRect(x, y - 8.5, 17, 17);
          ctx.strokeStyle = L.color;
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y - 8, 16, 16);
          ctx.fillStyle = L.color;
          ctx.font = `13px ${font}`;
          ctx.fillText("×", x + 4.5, y + 0.5);
          hit.xr = [x, y - 8.5, x + 17, y + 8.5];
          x += 17;
        }
        placed.push({ y, x2: x });
        hit.tag = [x0, y - 8.5, x, y + 8.5];
        S.thits.push(hit);
      }
      ctx.restore();
    });
  }
}

function tAxis(S) {
  const want = !S.rp && S.inst ? tLines(tradeInstOf(S.inst)) : [], keys = new Set();
  for (const L of want) {
    keys.add(L.key);
    const o = { price: L.price, color: L.color, lineVisible: false, axisLabelVisible: true, title: "" }, pl = S.tpl.get(L.key);
    if (pl) pl.applyOptions(o); else S.tpl.set(L.key, S.candle.createPriceLine(o));
  }
  for (const [k, pl] of S.tpl) if (!keys.has(k)) { S.candle.removePriceLine(pl); S.tpl.delete(k) }
}

function tRepaint(inst) {
  for (const S of slots) if (!inst || tradeInstOf(S.inst) === inst) { S.tlayer.requestUpdate?.(); tAxis(S) }
}

function tHover(S, pt) {
  if (S.rp || !S.thits.length) return null;
  if (S.thits.some(h => h.xr && inside(pt, ...h.xr))) return "x";
  return S.thits.some(h => h.drag && Math.abs(pt.y - h.y) < 5) ? "ns" : null;
}

function tKeyPrice(inst, key) {
  if (key === "tp" || key === "sl") return acct.pos[inst]?.[key];
  return acct.orders.find(o => "o" + o.id === key)?.px;
}

function tPointerDown(S, pt, e) {
  if (S.rp || !S.thits.length) return false;
  const inst = tradeInstOf(S.inst), xh = S.thits.find(h => h.xr && inside(pt, ...h.xr));
  if (xh) { e.stopPropagation(); tRemoveLine(inst, xh.key); return true }
  let best = null, bd = 5;
  for (const h of S.thits) if (h.drag && Math.abs(pt.y - h.y) < bd) { bd = Math.abs(pt.y - h.y); best = h }
  if (!best) return false;
  e.stopPropagation();
  tdrag = { S, inst, key: best.key, price: tKeyPrice(inst, best.key), moved: false };
  return true;
}

window.addEventListener("pointermove", e => {
  if (!tdrag) return;
  const p = tdrag.S.candle.coordinateToPrice(localPt(tdrag.S.box, e).y);
  if (p == null) return;
  tdrag.price = roundP(tdrag.inst, p);
  tdrag.moved = true;
  tRepaint(tdrag.inst);
});

window.addEventListener("pointerup", () => {
  if (!tdrag) return;
  const d = tdrag;
  tdrag = null;
  if (d.moved) tMoveLine(d.inst, d.key, d.price);
  tRepaint(d.inst);
});

function tRemoveLine(inst, key) {
  if (key === "tp" || key === "sl") tSetTpSl(inst, { [key]: null });
  else tCancel(+key.slice(1));
}

function tCancel(id) {
  const i = acct.orders.findIndex(o => o.id === id);
  if (i < 0) return;
  const [o] = acct.orders.splice(i, 1);
  saveAcct();
  syncTradeSubs();
  tRender();
  tSay(`${kindName(o.kind)} ${sideName(o.dir)} ${tqf(o.inst, o.qty)} @ ${tpf(o.inst, o.px)} 주문을 취소했어요`);
}

function tpslCheck(p, key, v, last) {
  if (v == null) return null;
  const above = (key === "tp") === (p.dir > 0);
  return (above ? v > last : v < last) ? null : `${key.toUpperCase()}${key === "tp" ? "는" : "은"} 현재가(${tpf(p.inst, last)})보다 ${above ? "위" : "아래"}여야 해요`;
}

function tSetTpSl(inst, vals) {
  const p = acct.pos[inst], last = lastOf(inst);
  if (!p) return false;
  for (const [k, v] of Object.entries(vals)) {
    if (v != null && !last) return tSay("시세를 받는 중이에요");
    const bad = tpslCheck(p, k, v, last);
    if (bad) { tRender(); return tSay(bad) }
  }
  Object.assign(p, vals);
  saveAcct();
  tRender();
  tSay(Object.entries(vals).map(([k, v]) => v == null ? `${k.toUpperCase()} 지움` : `${k.toUpperCase()} ${tpf(inst, v)}`).join(" · "));
  return true;
}

function tMoveLine(inst, key, price) {
  if (key === "tp" || key === "sl") { tSetTpSl(inst, { [key]: price }); return }
  const o = acct.orders.find(x => "o" + x.id === key), last = lastOf(inst);
  if (!o || !last || !(price > 0)) return;
  if (o.kind === "stop" && (o.dir > 0 ? last >= price : last <= price)) { tRender(); tSay(`스톱 ${o.dir > 0 ? "매수는 현재가보다 위" : "매도는 현재가보다 아래"}에 있어야 해요`); return }
  const bad = tpslError(o.dir, price, o.tp, o.sl, "주문 가격");
  if (bad) { tRender(); tSay(bad); return }
  const frozen = price * openQty(inst, o.dir, o.qty) / o.lev;
  if (frozen - o.frozen > availBal() + 1e-9) { tRender(); tSay("증거금이 모자라 가격을 바꿀 수 없어요"); return }
  o.px = price;
  o.frozen = frozen;
  tSay(`주문 가격 변경 · ${tpf(inst, price)}`);
  if (o.kind === "limit" && (o.dir > 0 ? price >= last : price <= last)) tFillOrder(o, last, TAKER);
  saveAcct();
  syncTradeSubs();
  tRender();
}

function amtK(inst, unit) { return unit === "margin" ? 1 / effCfg(inst).lev : 1 }

function qtyFor(inst, dir, amt, unit, price) {
  if (!(amt > 0) || !(price > 0)) return 0;
  if (unit === "coin") return amt;
  const k = amtK(inst, unit), p = acct.pos[inst];
  if (!p || !dir || p.dir === dir) return amt / (price * k);
  const full = p.qty * p.entry * k;
  if (Math.abs(amt - full) <= full * 0.005) return p.qty;
  return amt < full ? amt / (p.entry * k) : p.qty + (amt - full) / (price * k);
}

function amtFor(inst, dir, qty, unit, price) {
  if (unit === "coin") return qty;
  const k = amtK(inst, unit), p = acct.pos[inst];
  if (!p || !dir || p.dir === dir) return qty * price * k;
  const c = Math.min(qty, p.qty);
  return c * p.entry * k + (qty - c) * price * k;
}

function panelQty(inst, price, dir) {
  return qtyFor(inst, dir, num($("tQty").value), tr.unit === "coin" ? "coin" : "notional", price);
}

function curSlot() { return activeSlot && slots.includes(activeSlot) ? activeSlot : slots[0] }

let quick = (() => {
  try { const v = JSON.parse(store.get("okx.quick", "")); if (v && (v.unit === "margin" || v.unit === "coin")) return v } catch (e) {}
  return { unit: "margin", amt: "" };
})();

function tMenuClose() {
  $("tctx").classList.remove("open");
  tr.menu = null;
  tr.quick = null;
}

function tMenuPlace(x, y) {
  const el = $("tctx");
  el.style.left = Math.max(4, Math.min(x, innerWidth - el.offsetWidth - 4)) + "px";
  el.style.top = Math.max(4, Math.min(y, innerHeight - el.offsetHeight - 4)) + "px";
}

function tMenu(S, e) {
  if (S.rp || !S.ready) return;
  const inst = tradeInstOf(S.inst);
  if (!inst) return;
  e.preventDefault();
  activeSlot = S;
  tRender();
  const s = specs[inst], last = lastOf(inst), pt = localPt(S.box, e), raw = S.candle.coordinateToPrice(pt.y);
  if (!s || !last || raw == null) { tSay(specErr[inst]?.msg || "시세를 받는 중이에요"); return }
  const price = roundP(inst, raw), below = price < last, p = acct.pos[inst], P = tpf(inst, price);
  const it = (a, color, text, em) => `<div class="mi" data-a="${a}"><i style="background:${color}"></i>${text}${em ? `<em>${em}</em>` : ""}</div>`, sep = '<div class="sep"></div>';
  let h = `<div class="hd">${P} · 현재가보다 ${below ? "아래" : "위"}</div>`;
  h += below
    ? it("buy-limit", C("--up"), `지정가 매수 · 롱 @ ${P}`, "금액 입력 ›") + it("sell-stop", C("--down"), `스톱 매도 · 숏 @ ${P}`, "금액 입력 ›")
    : it("sell-limit", C("--down"), `지정가 매도 · 숏 @ ${P}`, "금액 입력 ›") + it("buy-stop", C("--up"), `스톱 매수 · 롱 @ ${P}`, "금액 입력 ›");
  if (p) {
    const k = (p.dir > 0) === below ? "sl" : "tp";
    h += sep + it(k, k === "tp" ? PROFIT : LOSS, `${dirName(p.dir)} 포지션 ${k.toUpperCase()} → ${P}`, `${susd(upnlAt(p, price))} USDT`);
  }
  const oh = S.thits.find(x => x.key[0] === "o" && x.y != null && Math.abs(pt.y - x.y) < 6);
  if (oh) h += sep + it("cancel", C("--muted"), "이 주문 취소");
  h += sep + it("hline", C("--draw"), "여기에 수평선");
  const el = $("tctx");
  el.innerHTML = h;
  el.classList.add("open");
  tMenuPlace(e.clientX + 2, e.clientY + 2);
  tr.menu = { S, inst, price, oid: oh ? +oh.key.slice(1) : null };
}

function tQuick(m, side, kind) {
  const inst = m.inst, dir = side === "buy" ? 1 : -1, el = $("tctx"), r = el.getBoundingClientRect();
  tr.quick = { inst, side, kind, dir };
  el.innerHTML =
    `<div class="qk"><div class="qh" style="color:${dir > 0 ? C("--up") : C("--down")}">${kindName(kind)} ${sideName(dir)} · ${dirName(dir)}<span>${esc(inst)}</span></div>` +
    `<div class="fld"><span>${kind === "stop" ? "트리거" : "가격"}</span><input id="qPx" inputmode="decimal" autocomplete="off" spellcheck="false" value="${tpf(inst, m.price).replace(/,/g, "")}"><u>USDT</u></div>` +
    `<div class="fld"><span id="qUl"></span><input id="qAmt" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0"><button id="qUnit" type="button" title="증거금(USDT)과 코인 수량 사이를 바꿉니다"></button></div>` +
    `<div class="pct" id="qPct"><button data-p="25">25%</button><button data-p="50">50%</button><button data-p="75">75%</button><button data-p="100">100%</button></div>` +
    `<dl id="qCalc"></dl>` +
    (acct.pos[inst] && acct.pos[inst].dir !== dir ? `<button id="qAll" class="mini" type="button">${dirName(-dir)} 포지션 전부 닫기</button>` : "") +
    `<div class="qgo"><button id="qGo" class="${dir > 0 ? "b" : "s"}">${kindName(kind)} ${sideName(dir)}</button><button id="qX">취소</button></div></div>`;
  $("qAmt").value = quick.unit === "margin" ? quick.amt || "" : "";
  qCalc();
  tMenuPlace(r.left, r.top);
  $("qAmt").focus();
  $("qAmt").select();
}

function qQty() {
  const q = tr.quick, price = num($("qPx").value), a = num($("qAmt").value);
  if (!q || !(price > 0) || !(a > 0)) return 0;
  return qtyFor(q.inst, q.dir, a, quick.unit, price);
}

function qCalc() {
  const q = tr.quick;
  if (!q) return;
  const inst = q.inst, s = specs[inst], c = effCfg(inst), price = num($("qPx").value), qty = roundQ(inst, qQty()), a = num($("qAmt").value);
  $("qUl").textContent = quick.unit === "margin" ? "증거금" : "수량";
  $("qUnit").textContent = quick.unit === "margin" ? "USDT" : s.ccy;
  const small = a > 0 && qty < s.min, op = acct.pos[inst], opp = op && op.dir !== q.dir;
  const cq = opp ? Math.min(qty, op.qty) : 0, nq = +(qty - cq).toFixed(8), U = esc(s.ccy);
  const plan = !opp || !(qty > 0) ? "" :
    `<dt>닫기</dt><dd>${dirName(op.dir)} ${tqf(inst, cq)} / ${tqf(inst, op.qty)} ${U}${cq >= op.qty ? " (전부)" : ""}</dd>` +
    (nq > 0 ? `<dt>새로 열기</dt><dd>${dirName(q.dir)} ${tqf(inst, nq)} ${U}</dd>` : "");
  $("qCalc").innerHTML =
    `<dt>수량</dt><dd>${qty > 0 ? `${tqf(inst, qty)} ${U}` : "-"}</dd>` + plan +
    `<dt>포지션 금액</dt><dd>${qty > 0 && price > 0 ? usd(qty * price) + " USDT" : "-"}</dd>` +
    `<dt>레버리지</dt><dd>${c.lev}x ${c.mode === "cross" ? "교차" : "격리"}</dd>` +
    `<dt>주문 가능</dt><dd>${usd(Math.max(0, availBal()))} USDT</dd>` +
    (small ? `<dt class="w">최소 주문</dt><dd class="w">${tqf(inst, s.min)} ${esc(s.ccy)} (증거금 약 ${usd(s.min * price / c.lev)} USDT)</dd>` : "");
}

function qSubmit() {
  const q = tr.quick;
  if (!q) return;
  const price = num($("qPx").value), qty = qQty();
  if (!(price > 0)) { tSay("가격을 넣어 주세요"); $("qPx").focus(); return }
  if (!(qty > 0)) { tSay(quick.unit === "margin" ? "넣을 증거금(USDT)을 입력하세요" : "수량을 입력하세요"); $("qAmt").focus(); return }
  if (tPlace(q.inst, q.side, q.kind, price, qty, null, null) === false) return;
  if (quick.unit === "margin") quick.amt = $("qAmt").value.trim();
  store.set("okx.quick", JSON.stringify(quick));
  tMenuClose();
}

$("tctx").addEventListener("click", e => {
  if (tr.quick) {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "qGo") qSubmit();
    else if (b.id === "qAll") {
      const op = acct.pos[tr.quick.inst];
      if (!op) return;
      $("qAmt").value = quick.unit === "coin" ? tqf(op.inst, op.qty) : amtFor(op.inst, tr.quick.dir, op.qty, "margin", num($("qPx").value)).toFixed(2);
      qCalc();
    }
    else if (b.id === "qX") tMenuClose();
    else if (b.id === "qUnit") {
      const price = num($("qPx").value), qty = qQty();
      quick.unit = quick.unit === "margin" ? "coin" : "margin";
      if (qty > 0 && price > 0) $("qAmt").value = quick.unit === "coin" ? tqf(tr.quick.inst, roundQ(tr.quick.inst, qty)) : amtFor(tr.quick.inst, tr.quick.dir, qty, "margin", price).toFixed(2);
      qCalc();
      $("qAmt").focus();
    } else if (b.dataset.p) {
      const inst = tr.quick.inst, price = num($("qPx").value), lev = effCfg(inst).lev;
      const margin = Math.max(0, availBal()) * +b.dataset.p / 100 / (1 + lev * TAKER);
      $("qAmt").value = quick.unit === "margin" ? (Math.floor(margin * 100) / 100).toFixed(2) : price > 0 ? tqf(inst, roundQ(inst, margin * lev / price)) : "";
      qCalc();
    }
    return;
  }
  const mi = e.target.closest(".mi[data-a]"), m = tr.menu;
  if (!mi || !m) return;
  const a = mi.dataset.a;
  if (/-(limit|stop)$/.test(a)) { const [side, kind] = a.split("-"); tQuick(m, side, kind); return }
  tMenuClose();
  if (a === "tp" || a === "sl") tSetTpSl(m.inst, { [a]: m.price });
  else if (a === "cancel") tCancel(m.oid);
  else if (a === "hline") {
    if (!m.S.inst) return;
    pushDrawHist(m.S.inst);
    drawingsOf(m.S.inst).push({ type: "h", price: +m.price.toFixed(m.S.prec) });
    saveDrawings(m.S.inst);
    syncDrawings(m.S.inst);
  }
});

$("tctx").addEventListener("input", () => qCalc());
$("tctx").addEventListener("keydown", e => {
  if (!tr.quick) return;
  if (e.key === "Enter") { e.preventDefault(); qSubmit() }
  else if (e.key === "Escape") { e.preventDefault(); tMenuClose() }
});

document.addEventListener("mousedown", e => { if (!$("tctx").contains(e.target)) tMenuClose() });
document.addEventListener("wheel", e => { if (!tr.quick) tMenuClose() }, { passive: true });

function tRender() {
  const S = curSlot(), inst = tradeInstOf(S?.inst);
  if (inst !== tr.inst) {
    tr.inst = inst;
    tr.newInst = true;
    if (inst) tTicker(inst);
    syncTradeSubs();
  }
  if (inst && !specs[inst] && !specP[inst] && !(Date.now() - (specErr[inst]?.at || 0) < 15000)) loadSpec(inst).then(() => tRender());
  if (tr.on && !tr.fold) tPanel(S);
  if (tr.on) tDock();
  $("balTxt").textContent = usd(equity());
  tRepaint();
}

  const notes = [];

  $("tMsg").textContent = err || notes.join(" · ");

  if (tr.newInst && s && last) {
    tr.newInst = false;

    tr.pxKeep = tpf(inst, last).replace(/,/g, "");

  }
  $("tUnit").textContent = tr.unit === "coin" ? (s?.ccy || "코인") : "USDT";
  $("tTpsl").hidden = !$("tTpslOn").checked;
  const price = tr.otype === "market" ? last : num($("tPx").value) || last, q = price ? panelQty(inst, price) : 0, mmr = inst ? mmrOf(inst, q) : 0.005;
  const notional = price && q ? price * q : 0, lq = (d) => price * (1 - d / c.lev) / (1 - d * mmr);

  $("tCalc").innerHTML =

    `<dt>예상 수수료</dt><dd>${notional ? usd(notional * (tr.otype === "limit" ? MAKER : TAKER)) + " USDT" : "-"}</dd>` +
    `<dt>${c.mode === "cross" ? "청산가" : "예상 청산가 롱 / 숏"}</dt><dd>${liqTxt}</dd>` +
    `<dt>주문 가능</dt><dd>${usd(Math.max(0, availBal()))} USDT</dd>`;

function posRow(p) {

      `<dt>포지션 증거금</dt><dd>${usd(posList().reduce((s, p) => s + posIM(p), 0))}</dd>` +
      `<dt>주문에 묶인 금액</dt><dd>${usd(frozenSum())}</dd>` +
      `<dt>주문 가능</dt><dd>${usd(Math.max(0, av))}</dd>`;
  }
}

  tr.on = on;
  store.set("okx.trade.on", on ? "1" : "0");
  document.body.classList.toggle("trading", on);
  $("tradeBtn").classList.toggle("active", on);
  document.body.classList.toggle("tfold", tr.fold);
  const w = tr.fold ? STRIP_W : TRADE_W;
  if (resize) post({ dx: on ? w : -w, dy: on ? DOCK_H : -DOCK_H });
  tr.sig = {};
  tRender();
}

function setFold(fold) {
  if (!tr.on || fold === tr.fold) return;
  tr.fold = fold;
  store.set("okx.trade.fold", fold ? "1" : "0");
  document.body.classList.toggle("tfold", fold);
  post({ dx: fold ? STRIP_W - TRADE_W : TRADE_W - STRIP_W });
  tr.sig = {};
  tRender();
}

function toggleTradeFold() {
  if (tr.on) { setFold(!tr.fold); return }
  tr.fold = false;
  store.set("okx.trade.fold", "0");
  setTrade(true, true);
}

$("tradeBtn").onclick = () => setTrade(!tr.on, true);
$("tFold").onclick = () => setFold(true);
$("tStrip").onclick = () => setFold(false);
$("balChip").onclick = () => { if (!tr.on) setTrade(true, true); tr.tab = "assets"; tDock() };

$("tMode").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"), inst = tr.inst;
  if (!b || !inst) return;
  if (lockedCfg(inst)) { tSay("포지션이나 미체결 주문이 있으면 마진 방식을 바꿀 수 없어요"); return }
  acct.cfg[inst] = { ...tCfg(inst), mode: b.dataset.v };
  saveAcct();
  tRender();
});

$("tLev").addEventListener("input", e => {
  const inst = tr.inst;
  if (!inst || lockedCfg(inst)) return;
  acct.cfg[inst] = { ...tCfg(inst), lev: +e.target.value };
  tRender();
});
$("tLev").addEventListener("change", () => { saveAcct(); $("tLev").blur() });

$("tType").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  const prev = tr.otype, last = lastOf(tr.inst);
  tr.otype = b.dataset.v;
  if (tr.otype === "market" && prev !== "market") { tr.pxKeep = $("tPx").value; $("tPx").value = "" }
  if (tr.otype !== "market" && prev === "market") $("tPx").value = tr.pxKeep || "";
  if (tr.otype !== "market" && !(num($("tPx").value) > 0) && last) $("tPx").value = tpf(tr.inst, last).replace(/,/g, "");
  tRender();
});

$("tUnit").onclick = () => {
  const inst = tr.inst, last = lastOf(inst), price = tr.otype === "market" ? last : num($("tPx").value) || last, v = num($("tQty").value);
  tr.unit = tr.unit === "coin" ? "usdt" : "coin";
  if (v > 0 && price) $("tQty").value = tr.unit === "usdt" ? (v * price).toFixed(2) : tqf(inst, roundQ(inst, v / price));
  tRender();
};

$("tPct").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]"), inst = tr.inst, last = lastOf(inst);
  if (!b || !inst || !last) return;
  const c = effCfg(inst), price = tr.otype === "market" ? last : num($("tPx").value) || last;
  const q = roundQ(inst, Math.max(0, availBal()) * +b.dataset.p / 100 * c.lev / (price * (1 + c.lev * TAKER)));
  $("tQty").value = tr.unit === "coin" ? tqf(inst, q) : (q * price).toFixed(2);
  tRender();
});

["tPx", "tQty", "tTp", "tSl"].forEach(id => $(id).addEventListener("input", () => tRender()));
$("tTpslOn").addEventListener("change", () => tRender());

function tSubmit(side) {
  const inst = tr.inst, last = lastOf(inst);
  if (!inst) return;
  const kind = tr.otype, price = kind === "market" ? last : num($("tPx").value);
  if (!(price > 0)) { tSay("가격을 넣어 주세요"); return }
  const qty = panelQty(inst, price, side === "buy" ? 1 : -1);
  if (!(qty > 0)) { tSay("수량을 넣어 주세요"); $("tQty").focus(); return }
  let tp = null, sl = null;
  if ($("tTpslOn").checked) {
    const a = num($("tTp").value), b = num($("tSl").value);
    tp = a > 0 ? roundP(inst, a) : null;
    sl = b > 0 ? roundP(inst, b) : null;
  }
  tPlace(inst, side, kind, price, qty, tp, sl);
}

$("tBuy").onclick = () => tSubmit("buy");
$("tSell").onclick = () => tSubmit("sell");

$("dTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]");
  if (!b) return;
  tr.tab = b.dataset.t;
  tr.sig = {};
  tDock();
});

function tSaveEdit(inst) {
  const a = $("eTp").value.trim(), b = $("eSl").value.trim();
  const tp = a ? roundP(inst, num(a)) : null, sl = b ? roundP(inst, num(b)) : null;
  if ((a && !(tp > 0)) || (b && !(sl > 0))) { tSay("TP·SL에는 가격을 넣어 주세요"); return }
  if (tSetTpSl(inst, { tp, sl })) { tr.editing = null; tDock() }
}

$("dBody").addEventListener("click", e => {
  const t = e.target.closest("[data-show],[data-close],[data-half],[data-edit],[data-save],[data-noedit],[data-cancel],[data-f],#dFundGo,#dReset");
  if (!t) return;
  const d = t.dataset;
  if (d.show) {
    const S = curSlot();
    if (S && S.inst !== d.show) pickInst(S, d.show);
  } else if (d.close || d.half) {
    const p = acct.pos[d.close || d.half], last = p && lastOf(p.inst);
    if (!p) return;
    if (!last) { tSay("시세를 받는 중이에요"); return }
    let q = p.qty;
    if (d.half) { const h = roundQ(p.inst, p.qty / 2); if (h > 0 && h >= (specs[p.inst]?.min || 0)) q = h }
    tClose(p, last, "수동", q, false);
    saveAcct();
    syncTradeSubs();
    tRender();
  } else if (d.edit) {
    tr.editing = d.edit;
    tDock();
    $("eTp")?.focus();
  } else if (d.noedit) {
    tr.editing = null;
    tDock();
  } else if (d.save) tSaveEdit(d.save);
  else if (d.cancel) tCancel(+d.cancel);
  else if (d.f) $("dFundIn").value = (+d.f).toLocaleString("en-US");
  else if (t.id === "dFundGo") {
    const v = num($("dFundIn").value);
    if (!(v > 0)) { $("dFundMsg").textContent = "충전할 금액을 넣거나 위 버튼을 누르세요."; return }
    acct.cash += v;
    acct.dep += v;
    tHist({ inst: "", why: "충전", act: `+${usd(v)} USDT`, dir: 0, px: null, qty: null, fee: 0, pnl: null });
    saveAcct();
    $("dFundIn").value = "";
    $("dFundMsg").textContent = `${usd(v)} USDT를 충전했어요.`;
    tRender();
  } else if (t.id === "dReset") {
    clearTimeout(resetT);
    if (!t.classList.contains("arm")) {
      t.classList.add("arm");
      t.textContent = "한 번 더 누르면 초기화";
      t.style.color = LOSS;
      resetT = setTimeout(() => { t.classList.remove("arm"); t.textContent = "계정 초기화"; t.style.color = "" }, 4000);
      return;
    }
    t.classList.remove("arm");
    t.textContent = "계정 초기화";
    t.style.color = "";
    acct = freshAcct();
    saveAcct();
    tr.sig = {};
    tr.editing = null;
    $("dFundMsg").textContent = "초기화했어요. 시드머니를 충전하고 다시 시작하세요.";
    syncTradeSubs();
    tRender();
  }
});

$("dBody").addEventListener("keydown", e => {
  if (e.target.id !== "eTp" && e.target.id !== "eSl") return;
  if (e.key === "Enter") { e.preventDefault(); tSaveEdit(tr.editing) }
  else if (e.key === "Escape") { tr.editing = null; tDock() }
});

$("dFundIn").addEventListener("keydown", e => { if (e.key === "Enter") $("dFundGo").click() });

for (const cfg of loadSlotConfig()) slots.push(makeSlot(cfg));
activeSlot = slots[0];
layout();
refreshWatchers();
slots.forEach(loadSlot);
connect();
for (const inst of tWanted()) loadSpec(inst);
setTrade(tr.on, false);
setInterval(tRender, 500);
setInterval(() => { if (tr.dirty) saveAcct() }, 5000);
setInterval(tFunding, 300000);
setInterval(() => { refreshTicker(); if (topp.classList.contains("open")) renderTop() }, 10000);
setInterval(watchdog, 20000);
</script>
</body>
</html>
