<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKX Mini Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1115;--panel:#161a21;--head:#12151b;--line:#232831;--text:#d6dae1;--muted:#7d8592;--up:#f04452;--down:#3182f6;--draw:#e0b341}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
body{display:flex;flex-direction:column}
nav{position:relative;display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid var(--line);flex:none}
nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:3px 8px;border-radius:4px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--draw);border-color:var(--draw)}
#dot{width:7px;height:7px;border-radius:50%;background:#555;margin-left:auto;flex:none}
#dot.on{background:#2fbf71}
#hint{display:none;position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;background:#161a21eb;border:1px solid var(--draw);border-radius:4px;padding:3px 8px;color:var(--draw);font-size:11px}
body.hinting #hint{display:block}
body.drawing .c *{cursor:crosshair!important}
.c.hov-ns *{cursor:ns-resize!important}
.c.hov-pt *{cursor:pointer!important}
.c.hov-move *{cursor:move!important}
.c.hov-ew *{cursor:ew-resize!important}
#indp{position:absolute;right:8px;top:100%;margin-top:2px;width:236px;background:var(--panel);border:1px solid #3a414d;border-radius:6px;padding:6px 8px;z-index:30;display:none;box-shadow:0 8px 24px #0009}
#indp.open{display:block}
#topp{position:absolute;right:8px;top:100%;margin-top:2px;width:min(360px,calc(100vw - 16px));background:var(--panel);border:1px solid #3a414d;border-radius:6px;padding:4px 0;z-index:30;display:none;box-shadow:0 8px 24px #0009}
#topp.open{display:block}
#topp .hd{display:flex;align-items:center;gap:4px;padding:2px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:2px;color:var(--muted);font-size:11px}
#topp .hd span{margin-right:auto}
#topp .hd button{padding:1px 6px;font-size:11px}
#topp .rk{width:16px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
#topp .vol{width:58px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums;flex:none}
#indp .row{display:flex;align-items:center;gap:6px;padding:3px 0}
#indp label{display:flex;align-items:center;gap:4px;cursor:pointer}
#indp input[type=color]{width:26px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;flex:none}
#indp input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
#indp input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
#indp select,#indp input[type=number]{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:2px 4px}
#indp select,#indp .nm{width:72px}
#indp input[type=number]{width:52px}
#indp .foot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
#indp .foot button{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:4px;cursor:pointer}
#indp .foot button:disabled{color:var(--muted);cursor:default}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.slot{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
.slot.collapsed{flex:none!important}
.sh{position:relative;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--head);flex:none}
.sym{width:140px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:3px 6px;border-radius:4px;font:inherit;font-weight:600;text-transform:uppercase}
.sym::placeholder{color:var(--muted);font-weight:400;text-transform:none}
.px{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc{font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{width:64px;height:18px;display:none;flex:none}
.slot.collapsed .spark{display:block}
.tf{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:2px 4px;cursor:pointer}
.ic{width:22px;height:22px;border:0;background:none;color:var(--muted);border-radius:4px;cursor:pointer;font-size:13px;line-height:22px;padding:0;flex:none}
.ic:hover{background:var(--panel);color:var(--text)}
.slot.only .cls{visibility:hidden}
.pane{position:relative;flex:1;min-height:90px}
.slot.collapsed .pane{display:none}
.empty{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);z-index:4;background:var(--bg)}
.slot.blank .empty{display:grid}
.lbl{position:absolute;left:6px;top:4px;z-index:3;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl b{color:var(--text);font-weight:600;margin-right:6px}
.lbl .ind{font-size:10px;margin-top:1px}
.lbl .ind span{margin-right:8px}
.c{position:absolute;inset:0}
.grip{flex:none;height:6px;cursor:row-resize;background:#0c0e12;display:grid;place-items:center}
.grip::after{content:"";width:26px;height:3px;border-top:1px solid #3a414d;border-bottom:1px solid #3a414d}
#add{flex:none;margin:6px 8px;border:1px dashed #3a414d;border-radius:6px;padding:6px;color:var(--muted);background:none;font:inherit;cursor:pointer}
#add:hover:not(:disabled){color:var(--text);border-color:#4a5262}
#add:disabled{opacity:.45;cursor:default}
.sugg{position:absolute;left:8px;top:30px;width:min(360px,calc(100vw - 16px));max-height:50vh;overflow:auto;background:var(--panel);border:1px solid #3a414d;border-radius:6px;z-index:20;display:none;box-shadow:0 8px 24px #0009}
.sugg.open{display:block}
.it{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer}
.it.sel{background:#232a36}
.it[data-i]:hover{background:#1d232d}
.it .id{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
.it .ipx{color:var(--muted);font-variant-numeric:tabular-nums}
.it .ipc{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.it.none{color:var(--muted);cursor:default}
#toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:#232a36;border:1px solid #3a414d;border-radius:6px;padding:7px 10px;z-index:40;white-space:nowrap}
#toast.open{display:flex}
#toast button{background:none;border:0;color:var(--draw);font:inherit;font-weight:600;cursor:pointer;padding:0}
#alBtn{display:inline-flex;align-items:center;gap:4px;position:relative}
#alBtn svg,.bell svg{width:11px;height:11px}
#alBadge{position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--draw);color:var(--bg);font-size:10px;font-weight:700;line-height:14px;text-align:center;display:none}
#alBadge.on{display:block}
#alp{position:absolute;right:8px;top:100%;margin-top:2px;width:min(300px,calc(100vw - 16px));max-height:calc(100vh - 50px);overflow-y:auto;background:var(--panel);border:1px solid #3a414d;border-radius:6px;padding:8px 10px 10px;z-index:30;display:none;box-shadow:0 8px 24px #0009}
#alp.open{display:flex;flex-direction:column;gap:10px}
#alp .hd{display:flex;align-items:center;justify-content:space-between}
#alp .hd b{font-size:13px;font-weight:600}
#alp label{display:flex;align-items:center;gap:5px;cursor:pointer}
#alp input[type=checkbox]{accent-color:var(--draw);margin:0}
#alp .sec{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
#alp .sec.first{border:0;padding:0}
#alp .k{font-size:11px;color:var(--muted)}
#alp .chips{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
#alp .chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-variant-numeric:tabular-nums}
#alp .chip i{width:8px;height:2px}
#alp .tfc{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--muted)}
#alp .tfc.on{border-color:var(--draw);color:var(--text)}
#alp input[type=number],#alp input[type=text],#alp select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:2px 4px}
#alp input[type=number]{width:44px}
#alp .wl{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:4px}
#alp .wr{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-bottom:1px solid #1c2129}
#alp .wr b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#alp .wr .x{background:none;border:0;color:var(--muted);padding:0 6px;font-size:13px}
#alp .wr .x:hover{color:var(--text)}
#alp .wl input[type=text]{width:100%;border:0;background:none;padding:5px 8px}
#alp .wl .sugg{top:100%;left:0;width:100%}
#alp .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
#alp .rec{display:flex;align-items:center;gap:6px;padding:3px 2px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
#alp .rec:hover{background:#1d232d}
#alp .rec .w{width:70px;color:var(--muted);flex:none}
#alp .rec .id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#alp .rec .p{width:64px;text-align:right;flex:none}
#alp .warn{color:var(--draw);font-size:11px}
#alp .test{color:var(--text)}
.bell{display:none;align-items:center;color:var(--draw);flex:none;margin-left:auto}
.slot.watched .bell{display:flex}
.slot.watched .tf{margin-left:0}
.rpb{display:none;align-items:center;gap:4px;padding:3px 8px;background:#1a1710;border-top:1px solid #3a321c;border-bottom:1px solid #3a321c;flex:none;flex-wrap:wrap}
.slot.replay .rpb{display:flex}
.slot.collapsed .rpb{display:none}
.rpb .rpt{color:var(--draw);font-weight:600;margin-right:2px}
.rpb button,.rpb select,.rpb input{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:2px 7px;border-radius:4px;font:inherit;cursor:pointer;white-space:nowrap}
.rpb input{background:var(--bg);color:var(--text);cursor:text;padding:1px 4px;color-scheme:dark}
.rpb button:hover,.rpb select:hover{color:var(--text)}
.rpb button.on{color:var(--draw);border-color:var(--draw)}
.rpb .rpp{min-width:58px}
.rpb .rpa{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.rpb [data-rp=end]{color:var(--text)}
.cut{position:absolute;top:0;bottom:0;z-index:2;pointer-events:none;display:none;background:#e0b34112;border-left:1.5px dashed var(--draw)}
.cut b{position:absolute;top:36px;left:6px;background:var(--draw);color:var(--bg);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.cut.flip b{left:auto;right:calc(100% + 6px)}
.slot.cutting .cut{display:block}
</style>
</head>
<body>
<nav>
  <button class="tool" data-mode="h" title="수평선(지지·저항): 누른 뒤 차트를 클릭">수평</button><button class="tool" data-mode="t" title="추세선: 누른 뒤 두 점을 클릭">추세</button><button class="tool" data-mode="r" title="가격 범위: 누른 뒤 두 점을 클릭하면 가격 차이·변동률·봉 수를 보여줍니다">범위</button><button class="tool" data-mode="L" title="롱 포지션: 누른 뒤 진입가를 클릭. 목표·손절선을 끌어 손익비를 맞춥니다">롱</button><button class="tool" data-mode="S" title="숏 포지션: 누른 뒤 진입가를 클릭. 목표·손절선을 끌어 손익비를 맞춥니다">숏</button><button class="tool" data-mode="P" title="리플레이: 누른 뒤 시작할 봉을 클릭. 그 봉까지만 보이고 한 봉씩 넘겨 봅니다">리플레이</button><button id="indBtn" title="이동평균·볼린저밴드·RSI">지표</button><button id="topBtn" title="24시간 거래대금 상위 10종목. 누르면 선택한 칸에 띄웁니다">TOP10</button><button id="shotBtn" title="화면 캡처(⌘S): 바탕화면에 저장하고 클립보드에도 복사합니다">캡처</button><button id="alBtn" title="이동평균 정배열·우상향 알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>알림<span id="alBadge"></span></button>
  <span id="dot" title="실시간 연결"></span>
  <div id="indp"></div>
  <div id="topp"></div>
  <div id="alp"></div>
</nav>
<main id="main"><button id="add">＋ 종목 추가</button></main>
<div id="hint"></div>
<div id="toast"><span id="toastMsg"></span><button id="undo">되돌리기</button></div>
<script>
const OKX_BAR = { "1m": "1m", "5m": "5m", "15m": "15m", "1h": "1H", "4h": "4H", "1d": "1D" };
const SEC = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };
const BARS = Object.keys(OKX_BAR);
const BAR_OF = Object.fromEntries(BARS.map(b => [OKX_BAR[b], b]));
const API = "https://www.okx.com/api/v5";
const WS_URL = "wss://ws.okx.com/ws/v5/business";
const TZ = -new Date().getTimezoneOffset() * 60;
const MAX_SLOTS = 6, NEW_PANE_H = 220, MIN_PANE_H = 90, WARMUP_BARS = 1000;
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const MA_COLORS = ["#f5c542", "#c77dff", "#2ec4b6", "#ff8c42"];
const BB_COLOR = "#8a94a6";
const RSI_COLOR = "#e879f9";
const PROFIT = "#26a69a", LOSS = "#ef5350", ENTRY = "#9aa3af";
const TWO_CLICK = ["t", "r"];
const RP_SPEEDS = [[1000, "초당 1봉"], [333, "초당 3봉"], [100, "초당 10봉"]];
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let ind = (() => {
  try { const v = JSON.parse(store.get("okx.ind", "")); if (v && v.ma && v.bb) return v } catch (e) {}
  return {
    ma: [{ on: false, type: "SMA", n: 5 }, { on: true, type: "SMA", n: 20 }, { on: true, type: "SMA", n: 60 }, { on: false, type: "SMA", n: 120 }],
    bb: { on: false, n: 20, k: 2 }
  };
})();
ind.rsi = ind.rsi || { on: false, n: 14 };
const maColor = k => ind.ma[k].color || MA_COLORS[k];
const bbColor = () => ind.bb.color || BB_COLOR;
const rsiColor = () => ind.rsi.color || RSI_COLOR;

let slots = [], activeSlot = null, nextId = 1;
let mode = null, pending = null, preview = null, selected = null, selectedInst = null, drag = null;
let ws = null, subs = new Set(), pingT = null, reconnectT = null, warmChain = Promise.resolve();
const drawCache = {};

const isDeriv = inst => /-SWAP$|-\d{6}$/.test(inst);
const volIdx = inst => isDeriv(inst) ? 6 : 5;
const instType = inst => /-SWAP$/.test(inst) ? "SWAP" : /-\d{6}$/.test(inst) ? "FUTURES" : "SPOT";
const fv = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(2) + "K" : v.toFixed(v < 10 ? 4 : 2);
const fmt = (S, v) => v.toLocaleString("en-US", { minimumFractionDigits: S.prec, maximumFractionDigits: S.prec });
const pctStr = v => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const inside = (pt, x1, y1, x2, y2) => pt.x >= x1 && pt.x <= x2 && pt.y >= y1 && pt.y <= y2;
const slotsOf = inst => slots.filter(S => S.inst === inst);

function toBar(r, inst) {
  const t = Math.floor(+r[0] / 1000) + TZ, o = +r[1], c = +r[4];
  return [
    { time: t, open: o, high: +r[2], low: +r[3], close: c },
    { time: t, value: +r[volIdx(inst)], color: (c >= o ? C("--up") : C("--down")) + "80" }
  ];
}

async function getJson(url) {
  const j = await (await fetch(url)).json();
  if (j.code !== "0") throw new Error(j.msg || "code " + j.code);
  return j.data;
}

function sma(cl, n) {
  const out = new Array(cl.length).fill(null);
  let s = 0;
  for (let i = 0; i < cl.length; i++) {
    s += cl[i];
    if (i >= n) s -= cl[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}

function vwma(cl, vl, n) {
  const out = new Array(cl.length).fill(null);
  let pv = 0, v = 0;
  for (let i = 0; i < cl.length; i++) {
    pv += cl[i] * vl[i]; v += vl[i];
    if (i >= n) { pv -= cl[i - n] * vl[i - n]; v -= vl[i - n] }
    if (i >= n - 1 && v > 0) out[i] = pv / v;
  }
  return out;
}

function ema(cl, n) {
  const out = new Array(cl.length).fill(null), k = 2 / (n + 1);
  let e = null;
  for (let i = n - 1; i < cl.length; i++) {
    if (i === n - 1) { e = 0; for (let j = 0; j < n; j++) e += cl[j]; e /= n }
    else e = cl[i] * k + e * (1 - k);
    out[i] = e;
  }
  return out;
}

function bollinger(cl, n, k) {
  const mid = sma(cl, n), up = [], lo = [];
  for (let i = 0; i < cl.length; i++) {
    if (mid[i] == null) { up.push(null); lo.push(null); continue }
    let v = 0;
    for (let j = i - n + 1; j <= i; j++) v += (cl[j] - mid[i]) ** 2;
    const sd = Math.sqrt(v / n);
    up.push(mid[i] + k * sd); lo.push(mid[i] - k * sd);
  }
  return [up, mid, lo];
}

function rsi(cl, n) {
  const out = new Array(cl.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1], up = d > 0 ? d : 0, dn = d < 0 ? -d : 0;
    if (i <= n) { g += up; l += dn; if (i < n) continue; g /= n; l /= n }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n }
    out[i] = l === 0 ? (g === 0 ? 50 : 100) : 100 - 100 / (1 + g / l);
  }
  return out;
}

function idxOfTime(bars, t) {
  let lo = 0, hi = bars.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (bars[m].time === t) return m;
    if (bars[m].time < t) lo = m + 1; else hi = m - 1;
  }
  return -1;
}

function timeToX(S, t) {
  const bars = S.bars, n = bars.length, iv = SEC[S.tf];
  if (!n) return null;
  let lg;
  if (t <= bars[0].time) lg = (t - bars[0].time) / iv;
  else if (t >= bars[n - 1].time) lg = n - 1 + (t - bars[n - 1].time) / iv;
  else {
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (bars[m].time <= t) lo = m; else hi = m }
    lg = lo + (t - bars[lo].time) / (bars[hi].time - bars[lo].time);
  }
  return S.chart.timeScale().logicalToCoordinate(lg);
}

function pointToTP(S, pt) {
  const lg = S.chart.timeScale().coordinateToLogical(pt.x), p = S.candle.coordinateToPrice(pt.y), n = S.bars.length;
  if (lg == null || p == null || !n) return null;
  const i = Math.round(lg), iv = SEC[S.tf];
  const t = i < 0 ? S.bars[0].time + i * iv : i >= n ? S.bars[n - 1].time + (i - n + 1) * iv : S.bars[i].time;
  return { t, p: +p.toFixed(S.prec) };
}

function rayXY(S, d, width) {
  let x1 = timeToX(S, d.t1), x2 = timeToX(S, d.t2);
  let y1 = S.candle.priceToCoordinate(d.p1), y2 = S.candle.priceToCoordinate(d.p2);
  if ([x1, x2, y1, y2].some(v => v == null)) return null;
  const anchors = [[x1, y1], [x2, y2]];
  if (x2 < x1) [x1, y1, x2, y2] = [x2, y2, x1, y1];
  if (x2 - x1 < 0.5) return { seg: [x1, y1, x2, y2], anchors };
  return { seg: [x1, y1, width, y1 + (y2 - y1) * (width - x1) / (x2 - x1)], anchors };
}

function distToSeg(px, py, [x1, y1, x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  const u = l ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)) : 0;
  return Math.hypot(px - (x1 + u * dx), py - (y1 + u * dy));
}

function boxXY(S, d) {
  const x1 = timeToX(S, d.t1), x2 = timeToX(S, d.t2);
  if (x1 == null || x2 == null) return null;
  const y = v => S.candle.priceToCoordinate(v);
  if (d.type === "r") {
    const y1 = y(d.p1), y2 = y(d.p2);
    return y1 == null || y2 == null ? null : { x1, y1, x2, y2 };
  }
  const ye = y(d.entry), yt = y(d.tp), ys = y(d.sl);
  return ye == null || yt == null || ys == null ? null : { xl: Math.min(x1, x2), xr: Math.max(x1, x2), ye, yt, ys };
}

function tag(ctx, text, x, y, bg, width) {
  ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
  const w = ctx.measureText(text).width + 10, h = 17, lx = Math.max(2, Math.min(width - w - 2, x - w / 2));
  ctx.fillStyle = bg;
  ctx.fillRect(lx, y - h / 2, w, h);
  ctx.fillStyle = "#fff";
  ctx.textBaseline = "middle";
  ctx.fillText(text, lx + 5, y + 0.5);
}

function handle(ctx, x, y, color) {
  ctx.fillStyle = C("--bg");
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.fillRect(x - 3.5, y - 3.5, 7, 7);
  ctx.strokeRect(x - 3.5, y - 3.5, 7, 7);
}

function drawTrend(ctx, S, d, temp, sel, width) {
  const r = rayXY(S, d, width);
  if (!r) return;
  const col = C("--draw");
  ctx.strokeStyle = ctx.fillStyle = col;
  ctx.lineWidth = sel ? 2.5 : 1.5;
  ctx.setLineDash(temp ? [4, 4] : []);
  ctx.beginPath(); ctx.moveTo(r.seg[0], r.seg[1]); ctx.lineTo(r.seg[2], r.seg[3]); ctx.stroke();
  ctx.setLineDash([]);
  for (const [x, y] of r.anchors) {
    ctx.beginPath(); ctx.arc(x, y, sel ? 4.5 : 2.5, 0, Math.PI * 2);
    if (sel) { ctx.fillStyle = C("--bg"); ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = col }
    else ctx.fill();
  }
}

function drawRange(ctx, S, d, temp, sel, width) {
  const g = boxXY(S, d);
  if (!g) return;
  const up = d.p2 >= d.p1, col = up ? C("--up") : C("--down");
  const xl = Math.min(g.x1, g.x2), xr = Math.max(g.x1, g.x2), yt = Math.min(g.y1, g.y2), yb = Math.max(g.y1, g.y2), xm = (xl + xr) / 2;
  ctx.fillStyle = col + "26";
  ctx.fillRect(xl, yt, xr - xl, yb - yt);
  ctx.strokeStyle = col;
  ctx.lineWidth = sel ? 1.5 : 1;
  ctx.setLineDash(temp ? [4, 4] : []);
  ctx.strokeRect(xl, yt, xr - xl, yb - yt);
  ctx.setLineDash([]);
  const ah = up ? 6 : -6;
  ctx.beginPath(); ctx.moveTo(xm, g.y1); ctx.lineTo(xm, g.y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xm - 4, g.y2 + ah); ctx.lineTo(xm, g.y2); ctx.lineTo(xm + 4, g.y2 + ah); ctx.stroke();
  const dp = d.p2 - d.p1, bars = Math.abs(Math.round((d.t2 - d.t1) / SEC[S.tf]));
  tag(ctx, `${dp >= 0 ? "+" : "-"}${fmt(S, Math.abs(dp))} (${pctStr(dp / d.p1 * 100)}) · ${bars}봉`, xm, up ? yt - 12 : yb + 12, col, width);
  if (sel) { handle(ctx, g.x1, g.y1, col); handle(ctx, g.x2, g.y2, col) }
}

function drawPosition(ctx, S, d, sel, width) {
  const g = boxXY(S, d);
  if (!g) return;
  const long = d.type === "L", w = g.xr - g.xl, dir = long ? 1 : -1, xm = (g.xl + g.xr) / 2;
  ctx.fillStyle = PROFIT + "33";
  ctx.fillRect(g.xl, Math.min(g.ye, g.yt), w, Math.abs(g.yt - g.ye));
  ctx.fillStyle = LOSS + "33";
  ctx.fillRect(g.xl, Math.min(g.ye, g.ys), w, Math.abs(g.ys - g.ye));
  ctx.strokeStyle = ENTRY;
  ctx.lineWidth = sel ? 1.5 : 1;
  ctx.beginPath(); ctx.moveTo(g.xl, g.ye); ctx.lineTo(g.xr, g.ye); ctx.stroke();
  const gain = (d.tp - d.entry) / d.entry * 100 * dir, loss = (d.sl - d.entry) / d.entry * 100 * dir;
  const rr = Math.abs(d.tp - d.entry) / Math.max(Math.abs(d.entry - d.sl), 1e-12);
  tag(ctx, `목표 ${fmt(S, d.tp)} (${pctStr(gain)})`, xm, g.yt + (g.yt < g.ye ? -12 : 12), PROFIT, width);
  tag(ctx, `손절 ${fmt(S, d.sl)} (${pctStr(loss)})`, xm, g.ys + (g.ys < g.ye ? -12 : 12), LOSS, width);
  tag(ctx, `${long ? "롱" : "숏"} ${fmt(S, d.entry)} · 손익비 ${rr.toFixed(2)}`, xm, g.ye, "#4a5262", width);
  if (sel) { handle(ctx, g.xl, g.yt, PROFIT); handle(ctx, g.xl, g.ys, LOSS); handle(ctx, g.xr, g.ye, ENTRY) }
}

class DrawLayer {
  constructor(S) {
    this.S = S; this.width = 0;
    this.view = { renderer: () => ({ draw: target => this.draw(target) }) };
  }
  attached({ requestUpdate }) { this.requestUpdate = requestUpdate }
  detached() { this.requestUpdate = null }
  updateAllViews() {}
  paneViews() { return [this.view] }
  draw(target) {
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
      const S = this.S, W = this.width = mediaSize.width;
      if (!S.inst) return;
      const list = drawingsOf(S.inst).filter(d => d.type !== "h").map(d => [d, false]);
      if (pending && pending.inst === S.inst && TWO_CLICK.includes(mode)) {
        const q = preview || pending;
        list.push([{ type: mode, t1: pending.t, p1: pending.p, t2: q.t, p2: q.p }, true]);
      }
      for (const [d, temp] of list) {
        const sel = d === selected;
        ctx.save();
        if (d.type === "t") drawTrend(ctx, S, d, temp, sel, W);
        else if (d.type === "r") drawRange(ctx, S, d, temp, sel, W);
        else drawPosition(ctx, S, d, sel, W);
        ctx.restore();
      }
    });
  }
}

function drawingsOf(inst) {
  if (!drawCache[inst]) {
    try { drawCache[inst] = JSON.parse(store.get("okx.draw." + inst, "[]")) } catch (e) { drawCache[inst] = [] }
  }
  return drawCache[inst];
}

function saveDrawings(inst) {
  store.set("okx.draw." + inst, JSON.stringify(drawingsOf(inst)));
  updateClearBtn();
}

function syncDrawings(inst) {
  for (const S of inst ? slotsOf(inst) : slots) {
    S.hlines.forEach(l => S.candle.removePriceLine(l));
    S.hlines = S.inst ? drawingsOf(S.inst).filter(d => d.type === "h").map(d =>
      S.candle.createPriceLine({ price: d.price, color: C("--draw"), lineWidth: d === selected ? 2 : 1, lineStyle: 0, axisLabelVisible: true, title: "" })) : [];
    S.layer.requestUpdate?.();
  }
}

function repaint(inst) { for (const S of inst ? slotsOf(inst) : slots) S.layer.requestUpdate?.() }

const lineOpts = color => ({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });

function makeSlot(cfg, beforeEl) {
  const S = {
    id: nextId++, inst: cfg.inst || null, tf: BARS.includes(cfg.tf) ? cfg.tf : "15m", collapsed: !!cfg.collapsed, w: cfg.w || NEW_PANE_H,
    bars: [], vols: [], ind: null, hlines: [], last: null, hover: false, loadingOld: false, noMore: false, gen: 0, prec: 2, ready: false,
    sugg: [], selIdx: 0, retryT: null, rp: null
  };
  const el = document.createElement("section");
  el.className = "slot";
  el.innerHTML =
    `<div class="sh"><input class="sym" spellcheck="false" autocomplete="off" placeholder="종목 검색">` +
    `<span class="px">-</span><span class="pc"></span><canvas class="spark"></canvas>` +
    `<span class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>` +
    `<select class="tf" title="봉 간격">${BARS.map(b => `<option value="${b}">${b}</option>`).join("")}</select>` +
    `<button class="ic col" title="접기"></button><button class="ic cls" title="닫기">×</button><div class="sugg"></div></div>` +
    `<div class="rpb"><span class="rpt">리플레이</span><button data-rp="pick" title="다른 시작점 고르기">✂ 시작점</button>` +
    `<input type="datetime-local" class="rpd" title="이 시각부터 다시 시작">` +
    `<button data-rp="play" class="rpp" title="재생·멈춤 (Space)">▶ 재생</button><button data-rp="step" title="한 봉 앞으로 (Shift+→)">한 봉 ▷</button>` +
    `<select class="rps" title="재생 속도">${RP_SPEEDS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>` +
    `<span class="rpa"></span><button data-rp="end" title="실시간으로 돌아가기">끝내기</button></div>` +
    `<div class="pane"><div class="lbl"></div><div class="c"></div><div class="cut"><b></b></div><div class="empty">종목을 고르면 여기에 차트가 나와요</div></div>`;
  Object.assign(S, {
    el, symEl: el.querySelector(".sym"), pxEl: el.querySelector(".px"), pcEl: el.querySelector(".pc"), spark: el.querySelector(".spark"),
    tfEl: el.querySelector(".tf"), bellEl: el.querySelector(".bell"), colBtn: el.querySelector(".col"), suggEl: el.querySelector(".sugg"),
    pane: el.querySelector(".pane"), lbl: el.querySelector(".lbl"), box: el.querySelector(".c"),
    cutEl: el.querySelector(".cut"), rpDate: el.querySelector(".rpd"), rpPlay: el.querySelector(".rpp"), rpSpeedEl: el.querySelector(".rps"), rpAt: el.querySelector(".rpa")
  });
  S.tfEl.value = S.tf;
  S.chart = LightweightCharts.createChart(S.box, {
    autoSize: true,
    layout: { background: { color: C("--bg") }, textColor: C("--muted"), fontSize: 10, attributionLogo: false },
    grid: { vertLines: { color: C("--line") }, horzLines: { color: C("--line") } },
    rightPriceScale: { borderColor: C("--line") },
    timeScale: { borderColor: C("--line"), timeVisible: S.tf !== "1d", secondsVisible: false, rightOffset: 3 },
    crosshair: { mode: 0 }
  });
  S.candle = S.chart.addCandlestickSeries({
    upColor: C("--up"), downColor: C("--down"), borderVisible: false, wickUpColor: C("--up"), wickDownColor: C("--down"),
    autoscaleInfoProvider: orig => {
      const o = orig(), f = S.rpFreeze;
      if (!f) return o;
      if (!o) return { priceRange: { ...f } };
      return { ...o, priceRange: { minValue: Math.min(f.minValue, o.priceRange.minValue), maxValue: Math.max(f.maxValue, o.priceRange.maxValue) } };
    }
  });
  S.vol = S.chart.addHistogramSeries({ priceScaleId: "", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  S.rsi = S.chart.addLineSeries({
    ...lineOpts(rsiColor()), priceScaleId: "rsi", priceFormat: { type: "price", precision: 2, minMove: 0.01 },
    autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } })
  });
  [70, 50, 30].forEach(v => S.rsi.createPriceLine({ price: v, color: v === 50 ? "#3a414d" : "#5a6270", lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
  applyMargins(S);
  S.ma = MA_COLORS.map((_, k) => S.chart.addLineSeries(lineOpts(maColor(k))));
  S.bbs = [0, 1, 2].map(i => S.chart.addLineSeries({ ...lineOpts(bbColor()), lineStyle: i === 1 ? 2 : 0 }));
  S.layer = new DrawLayer(S);
  S.candle.attachPrimitive(S.layer);

  S.chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && r.from < 60) loadOlder(S, S.gen) });
  S.chart.subscribeCrosshairMove(p => {
    const c = p.time && p.seriesData.get(S.candle), v = p.time && p.seriesData.get(S.vol);
    S.hover = !!c;
    if (c) renderLbl(S, idxOfTime(S.bars, p.time), `시 ${fmt(S, c.open)} 고 ${fmt(S, c.high)} 저 ${fmt(S, c.low)} 종 ${fmt(S, c.close)} · 량 ${v ? fv(v.value) : "-"}`);
    else showLbl(S);
    if (TWO_CLICK.includes(mode) && pending && pending.inst === S.inst && p.point) { preview = pointToTP(S, p.point) || preview; repaint(S.inst) }
    if (mode === "P") moveCut(S, p.point);
  });
  S.chart.subscribeClick(p => onChartClick(S, p));
  S.box.addEventListener("pointerdown", e => onPointerDown(S, e), true);
  S.box.addEventListener("mousedown", e => { if (drag) e.stopPropagation() }, true);
  S.box.addEventListener("pointermove", e => {
    if (!drag && !mode) setHoverCursor(S, e);
    if (e.buttons === 1 && !drag && !mode) S.rpFreeze = null;
  });
  S.box.addEventListener("wheel", () => { S.rpFreeze = null }, { passive: true });
  el.addEventListener("pointerdown", () => { activeSlot = S; updateClearBtn() }, true);

  wireSymbolInput(S);
  S.tfEl.addEventListener("change", () => {
    S.tf = S.tfEl.value;
    S.chart.applyOptions({ timeScale: { timeVisible: S.tf !== "1d" } });
    saveSlots();
    if (S.rp) replayFrom(S, S.rp.T); else loadSlot(S);
    syncSubs();
  });
  wireReplayBar(S);
  S.colBtn.addEventListener("click", () => setCollapsed(S, !S.collapsed));
  el.querySelector(".cls").addEventListener("click", () => closeSlot(S));

  $("main").insertBefore(el, beforeEl || $("add"));
  return S;
}

function applyMargins(S) {
  const on = ind.rsi.on;
  S.candle.priceScale().applyOptions({ scaleMargins: on ? { top: 0.06, bottom: 0.45 } : { top: 0.08, bottom: 0.28 } });
  S.vol.priceScale().applyOptions({ scaleMargins: on ? { top: 0.6, bottom: 0.3 } : { top: 0.78, bottom: 0 } });
  S.rsi.priceScale().applyOptions({ scaleMargins: { top: 0.74, bottom: 0.03 } });
  S.rsi.applyOptions({ visible: on });
}

function renderLbl(S, i, text) {
  const parts = [];
  ind.ma.forEach((m, k) => {
    if (!m.on) return;
    const v = S.ind?.ma[k]?.[i];
    parts.push(`<span style="color:${maColor(k)}">${m.type}${m.n} ${v == null ? "-" : fmt(S, v)}</span>`);
  });
  if (ind.bb.on) {
    const u = S.ind?.bb?.[0][i], l = S.ind?.bb?.[2][i];
    parts.push(`<span style="color:${bbColor()}">BB ${u == null ? "-" : fmt(S, u)} / ${l == null ? "-" : fmt(S, l)}</span>`);
  }
  if (ind.rsi.on) {
    const v = S.ind?.rsi?.[i];
    parts.push(`<span style="color:${rsiColor()}">RSI${ind.rsi.n} ${v == null ? "-" : v.toFixed(2)}</span>`);
  }
  S.lbl.innerHTML = `<div><b>${S.tf}</b>${text}</div>` + (parts.length ? `<div class="ind">${parts.join("")}</div>` : "");
}

function showLbl(S) {
  const v = S.rp ? S.vols.at(-1)?.value : S.last ? +S.last[volIdx(S.inst)] : null;
  renderLbl(S, S.bars.length - 1, v != null ? `거래량 ${fv(v)}` : "");
}

function paintInd(S, full) {
  const cl = S.bars.map(x => x.close), vl = S.vols.map(x => x.value);
  S.ind = {
    ma: ind.ma.map(m => !m.on ? null : m.type === "EMA" ? ema(cl, m.n) : m.type === "VWMA" ? vwma(cl, vl, m.n) : sma(cl, m.n)),
    bb: ind.bb.on ? bollinger(cl, ind.bb.n, ind.bb.k) : null,
    rsi: ind.rsi.on ? rsi(cl, ind.rsi.n) : null
  };
  const n = S.bars.length;
  const pt = (arr, j) => arr[j] == null ? { time: S.bars[j].time } : { time: S.bars[j].time, value: arr[j] };
  const apply = (s, arr) => {
    if (!arr) { if (full) s.setData([]); return }
    if (full) s.setData(S.bars.map((_, j) => pt(arr, j)));
    else if (n) s.update(pt(arr, n - 1));
  };
  S.ma.forEach((s, k) => apply(s, S.ind.ma[k]));
  S.bbs.forEach((s, k) => apply(s, S.ind.bb && S.ind.bb[k]));
  apply(S.rsi, S.ind.rsi);
}

function drawSpark(S) {
  if (!S.collapsed) return;
  const cv = S.spark, r = devicePixelRatio || 1, cl = S.bars.slice(-60).map(b => b.close);
  cv.width = 64 * r; cv.height = 18 * r;
  const x = cv.getContext("2d");
  x.scale(r, r);
  if (cl.length < 2) return;
  const lo = Math.min(...cl), hi = Math.max(...cl);
  x.strokeStyle = cl.at(-1) >= cl[0] ? C("--up") : C("--down");
  x.lineWidth = 1.2;
  x.beginPath();
  cl.forEach((c, i) => { const px = i / (cl.length - 1) * 62 + 1, py = 16 - (c - lo) / (hi - lo || 1) * 14; i ? x.lineTo(px, py) : x.moveTo(px, py) });
  x.stroke();
}

function setPriceText(S, last) {
  S.pxEl.textContent = last == null ? "-" : fmt(S, last);
}

function setChange(S, last, open) {
  if (!open) { S.pcEl.textContent = ""; return }
  const pct = (last - open) / open * 100;
  S.pcEl.textContent = pctStr(pct);
  S.pcEl.style.color = pct >= 0 ? C("--up") : C("--down");
}

function resetSeries(S) {
  S.bars = []; S.vols = []; S.last = null; S.ready = false; S.rpFreeze = null;
  S.candle.setData([]); S.vol.setData([]); S.candle.setMarkers([]);
  S.ma.forEach(s => s.setData([])); S.bbs.forEach(s => s.setData([])); S.rsi.setData([]);
  S.candle.priceScale().applyOptions({ autoScale: true });
}

async function loadSlot(S) {
  const g = ++S.gen;
  clearTimeout(S.retryT);
  if (S.rp) { rpPause(S); S.rp = null; setRpUi(S, false) }
  S.noMore = false; S.loadingOld = false;
  S.symEl.value = S.inst || "";
  S.el.classList.toggle("blank", !S.inst);
  updateTitle();
  resetSeries(S);
  setPriceText(S, null);
  setChange(S, 0, 0);
  syncDrawings(S.inst);
  if (!S.inst) { S.lbl.innerHTML = ""; return }
  try {
    const tick = (await getJson(`${API}/public/instruments?instType=${instType(S.inst)}&instId=${S.inst}`))[0].tickSz;
    if (g !== S.gen) return;
    S.prec = (tick.split(".")[1] || "").length;
    S.candle.applyOptions({ priceFormat: { type: "price", precision: S.prec, minMove: +tick } });
    const rows = (await getJson(`${API}/market/candles?instId=${S.inst}&bar=${OKX_BAR[S.tf]}&limit=300`)).slice().reverse();
    if (g !== S.gen) return;
    const bars = rows.map(r => toBar(r, S.inst));
    S.bars = bars.map(x => x[0]);
    S.vols = bars.map(x => x[1]);
    S.candle.setData(S.bars);
    S.vol.setData(S.vols);
    paintInd(S, true);
    updateMarkers(S);
    S.last = rows.at(-1);
    S.ready = true;
    showLbl(S);
    if (S.last) setPriceText(S, +S.last[4]);
    S.chart.timeScale().scrollToRealTime();
    syncDrawings(S.inst);
    drawSpark(S);
    refreshTicker(S.inst);
    warmChain = warmChain.then(() => warmup(S, g));
  } catch (e) {
    if (g !== S.gen) return;
    S.pxEl.textContent = "조회 실패";
    S.pcEl.textContent = e.message;
    S.pcEl.style.color = C("--muted");
    S.retryT = setTimeout(() => loadSlot(S), 10000);
  }
}

async function warmup(S, g) {
  while (g === S.gen && slots.includes(S) && !S.noMore && S.bars.length < WARMUP_BARS) {
    const before = S.bars.length;
    await loadOlder(S, g);
    if (S.bars.length === before) break;
    await new Promise(r => setTimeout(r, 150));
  }
}

async function loadOlder(S, g) {
  if (!S.inst || !S.ready || S.loadingOld || S.noMore || !S.bars.length || g !== S.gen) return;
  S.loadingOld = true;
  try {
    const oldest = (S.bars[0].time - TZ) * 1000;
    const rows = (await getJson(`${API}/market/history-candles?instId=${S.inst}&bar=${OKX_BAR[S.tf]}&after=${oldest}&limit=300`)).slice().reverse();
    if (g !== S.gen) return;
    const add = rows.map(r => toBar(r, S.inst)).filter(x => x[0].time < S.bars[0].time);
    if (!add.length) { S.noMore = true; return }
    const range = S.chart.timeScale().getVisibleLogicalRange();
    if (S.rp) {
      S.rp.bars = add.map(x => x[0]).concat(S.rp.bars);
      S.rp.vols = add.map(x => x[1]).concat(S.rp.vols);
    }
    S.bars = add.map(x => x[0]).concat(S.bars);
    S.vols = add.map(x => x[1]).concat(S.vols);
    S.candle.setData(S.bars);
    S.vol.setData(S.vols);
    paintInd(S, true);
    updateMarkers(S);
    if (range) S.chart.timeScale().setVisibleLogicalRange({ from: range.from + add.length, to: range.to + add.length });
    S.layer.requestUpdate?.();
  } catch (e) {
  } finally {
    S.loadingOld = false;
  }
}

async function refreshTicker(only) {
  const insts = only ? [only] : [...new Set(slots.map(S => S.inst).filter(Boolean))];
  for (const inst of insts) {
    try {
      const t = (await getJson(`${API}/market/ticker?instId=${inst}`))[0];
      for (const S of slotsOf(inst)) if (!S.rp) { setPriceText(S, +t.last); setChange(S, +t.last, +t.open24h) }
    } catch (e) {}
  }
}

function wantedSubs() {
  return new Set([
    ...slots.filter(S => S.inst).map(S => `candle${OKX_BAR[S.tf]}|${S.inst}`),
    ...[...watchers.values()].map(W => `candle${OKX_BAR[W.tf]}|${W.inst}`)
  ]);
}

function syncSubs() {
  refreshWatchers();
  if (!ws || ws.readyState !== 1) return;
  const want = wantedSubs(), arg = k => { const [channel, instId] = k.split("|"); return { channel, instId } };
  const add = [...want].filter(k => !subs.has(k)), del = [...subs].filter(k => !want.has(k));
  if (del.length) ws.send(JSON.stringify({ op: "unsubscribe", args: del.map(arg) }));
  if (add.length) ws.send(JSON.stringify({ op: "subscribe", args: add.map(arg) }));
  subs = want;
}

function setDot(on) { $("dot").classList.toggle("on", on) }

function connect() {
  clearTimeout(reconnectT);
  const s = new WebSocket(WS_URL);
  ws = s;
  subs = new Set();
  s.onopen = () => {
    setDot(true);
    syncSubs();
    for (const W of watchers.values()) if (W.ready) catchUp(W);
    pingT = setInterval(() => s.readyState === 1 && s.send("ping"), 20000);
  };
  s.onmessage = e => {
    if (e.data === "pong") return;
    const m = JSON.parse(e.data);
    if (!m.data || !m.arg) return;
    const tf = BAR_OF[m.arg.channel.slice(6)], inst = m.arg.instId;
    for (const S of slots) {
      if (S.inst !== inst || S.tf !== tf || !S.ready || S.rp) continue;
      for (const r of m.data) {
        const [c, v] = toBar(r, inst);
        try { S.candle.update(c); S.vol.update(v) } catch (err) { continue }
        if (S.bars.length && S.bars[S.bars.length - 1].time === c.time) { S.bars[S.bars.length - 1] = c; S.vols[S.vols.length - 1] = v }
        else { S.bars.push(c); S.vols.push(v) }
        paintInd(S, false);
        S.last = r;
        if (!S.hover) showLbl(S);
        drawSpark(S);
      }
    }
    for (const T of slotsOf(inst)) if (T.ready && !T.rp) setPriceText(T, +m.data.at(-1)[4]);
    const W = watchers.get(`${tf}|${inst}`);
    if (W && W.ready) for (const r of m.data) onWatchBar(W, r);
  };
  s.onclose = () => {
    if (ws !== s) return;
    setDot(false);
    clearInterval(pingT);
    ws = null;
    reconnectT = setTimeout(() => { slots.forEach(S => { if (!S.rp) loadSlot(S) }); connect() }, 3000);
  };
  s.onerror = () => s.close();
}

function saveSlots() {
  store.set("okx.slots", JSON.stringify(slots.map(S => ({ inst: S.inst, tf: S.tf, collapsed: S.collapsed, w: Math.round(S.w) }))));
}

function loadSlotConfig() {
  try {
    const v = JSON.parse(store.get("okx.slots", ""));
    if (Array.isArray(v) && v.length) return v.slice(0, MAX_SLOTS);
  } catch (e) {}
  let tf = "15m";
  try { const shown = JSON.parse(store.get("okx.shown", "")); if (shown && BARS.includes(shown[0])) tf = shown[0] } catch (e) {}
  return [{ inst: store.get("okx.inst", "BTC-USDT"), tf }];
}

function updateTitle() {
  document.title = slots.map(S => S.inst || "새 칸").join(" · ") || "OKX Mini Chart";
}

function growWindow(dy) {
  if (!dy) return;
  try { window.webkit.messageHandlers.win.postMessage({ dy: Math.round(dy) }) } catch (e) {}
}

function measureWeights() {
  for (const S of slots) if (!S.collapsed) S.w = Math.max(MIN_PANE_H, S.pane.getBoundingClientRect().height);
}

function headerH() {
  return slots[0]?.el.querySelector(".sh").getBoundingClientRect().height || 31;
}

function layout() {
  const main = $("main");
  main.querySelectorAll(".grip").forEach(g => g.remove());
  slots.forEach((S, i) => {
    main.insertBefore(S.el, $("add"));
    S.el.style.flex = S.collapsed ? "none" : `${S.w} 1 0px`;
    S.el.style.minHeight = S.collapsed ? "" : `${headerH() + MIN_PANE_H}px`;
    S.el.classList.toggle("collapsed", S.collapsed);
    S.el.classList.toggle("only", slots.length === 1);
    S.colBtn.textContent = S.collapsed ? "⌄" : "⌃";
    S.colBtn.title = S.collapsed ? "펼치기" : "접기";
    const next = slots[i + 1];
    if (next && !S.collapsed && !next.collapsed) main.insertBefore(makeGrip(S, next), $("add"));
  });
  $("add").disabled = slots.length >= MAX_SLOTS;
  $("add").textContent = slots.length >= MAX_SLOTS ? `종목은 ${MAX_SLOTS}개까지 볼 수 있어요` : "＋ 종목 추가";
  updateTitle();
}

function makeGrip(a, b) {
  const g = document.createElement("div");
  g.className = "grip";
  g.title = "끌어서 높이 조절 · 두 번 클릭하면 똑같이";
  g.addEventListener("pointerdown", e => {
    e.preventDefault();
    measureWeights();
    const y0 = e.clientY, a0 = a.w, b0 = b.w;
    const move = ev => {
      const na = Math.max(MIN_PANE_H, Math.min(a0 + b0 - MIN_PANE_H, a0 + ev.clientY - y0));
      a.w = na; b.w = a0 + b0 - na;
      a.el.style.flex = `${a.w} 1 0px`; b.el.style.flex = `${b.w} 1 0px`;
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); saveSlots() };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
  g.addEventListener("dblclick", () => {
    measureWeights();
    const open = slots.filter(S => !S.collapsed), avg = open.reduce((s, S) => s + S.w, 0) / open.length;
    open.forEach(S => { S.w = avg });
    layout();
    saveSlots();
  });
  return g;
}

function addSlot() {
  if (slots.length >= MAX_SLOTS) return;
  measureWeights();
  const last = slots.at(-1);
  const S = makeSlot({ inst: null, tf: last ? last.tf : "15m", w: NEW_PANE_H });
  slots.push(S);
  layout();
  growWindow(NEW_PANE_H + headerH() + 1 + (last && !last.collapsed ? 6 : 0));
  saveSlots();
  loadSlot(S);
  S.el.scrollIntoView({ block: "nearest" });
  S.symEl.focus();
}

let undoInfo = null, toastT = null;

function closeSlot(S) {
  if (slots.length <= 1) return;
  measureWeights();
  const i = slots.indexOf(S), h = S.el.getBoundingClientRect().height + 6;
  slots.splice(i, 1);
  S.gen++;
  clearTimeout(S.retryT);
  rpPause(S);
  S.rp = null;
  if (selectedInst === S.inst && !slotsOf(S.inst).length) select(null);
  if (pending && pending.inst === S.inst && !slotsOf(S.inst).length) setMode(null);
  S.chart.remove();
  S.el.remove();
  if (activeSlot === S) activeSlot = slots[Math.min(i, slots.length - 1)];
  layout();
  growWindow(-h);
  saveSlots();
  syncSubs();
  undoInfo = { cfg: { inst: S.inst, tf: S.tf, collapsed: S.collapsed, w: S.w }, index: i, h };
  showToast(`${S.inst || "빈"} 칸을 닫았어요`, true);
}

function showToast(msg, undo) {
  if (!undo) undoInfo = null;
  $("toastMsg").textContent = msg;
  $("undo").hidden = !undo;
  $("toast").classList.add("open");
  clearTimeout(toastT);
  toastT = setTimeout(() => { $("toast").classList.remove("open"); undoInfo = null }, undo ? 5000 : 2500);
}

// 캡처 직전에 앱이 부른다. 토스트·안내·선택을 걷어 내고 파일 이름에 쓸 종목을 돌려준다.
window.prepShot = () => {

$("shotBtn").onclick = () => {

$("undo").addEventListener("click", () => {
  if (!undoInfo || slots.length >= MAX_SLOTS) return;

  clearTimeout(toastT);
  $("toast").classList.remove("open");

function setCollapsed(S, on) {
  if (S.collapsed === on) return;

  const paneH = on ? S.pane.getBoundingClientRect().height : S.w;

  layout();
  growWindow(on ? -paneH : paneH);

}

$("add").addEventListener("click", addSlot);

const HINTS = {
  h: "수평선: 차트를 클릭하면 그 가격에 선이 생깁니다 · Esc 취소",
  t: "추세선: 시작점과 끝점을 차례로 클릭하세요 · Esc 취소",
  r: "가격 범위: 시작점과 끝점을 차례로 클릭하세요 · Esc 취소",
  L: "롱 포지션: 진입가를 클릭하세요 · 생긴 뒤 목표·손절선을 끌어 조정 · Esc 취소",
  S: "숏 포지션: 진입가를 클릭하세요 · 생긴 뒤 목표·손절선을 끌어 조정 · Esc 취소",
  P: "리플레이: 시작할 봉을 클릭하세요 · 그 봉까지만 보이고 뒤는 가려집니다 · Esc 취소",
  sel: "선택됨: 끌어서 조정하고 Backspace 로 지웁니다 · Esc 선택 해제"
};

function updateHint() {
  const h = mode ? HINTS[mode] : selected ? HINTS.sel : "";
  $("hint").textContent = h;
  document.body.classList.toggle("hinting", !!h);
}

function setMode(m) {
  mode = m; pending = null; preview = null;
  if (m) { selected = null; selectedInst = null }
  if (m !== "P") slots.forEach(x => x.el.classList.remove("cutting"));
  document.querySelectorAll(".rpb [data-rp=pick]").forEach(x => x.classList.toggle("on", m === "P"));
  document.body.classList.toggle("drawing", !!m);
  document.querySelectorAll(".tool[data-mode]").forEach(x => x.classList.toggle("active", x.dataset.mode === m));
  updateHint();
  syncDrawings();
}

function select(d, inst) {
  if (selected === d) return;
  selected = d;
  selectedInst = d ? inst : null;
  updateHint();
  syncDrawings();
}

function deleteSelected() {
  const inst = selectedInst, arr = drawingsOf(inst), i = arr.indexOf(selected);
  if (i >= 0) arr.splice(i, 1);
  selected = null; selectedInst = null;
  saveDrawings(inst);
  updateHint();
  syncDrawings();
}

function hitTest(S, pt) {
  let best = null, bestD = 7;
  if (!S.inst) return null;
  const consider = (d, part, dist) => { if (dist < bestD) { bestD = dist; best = { d, part } } };
  const near = (x, y) => Math.hypot(x - pt.x, y - pt.y) - 3;
  for (const d of drawingsOf(S.inst)) {
    if (d.type === "h") {
      const y = S.candle.priceToCoordinate(d.price);
      if (y != null) consider(d, "h", Math.abs(y - pt.y));
    } else if (d.type === "t") {
      const r = rayXY(S, d, S.layer.width || 10000);
      if (!r) continue;
      r.anchors.forEach(([x, y], i) => consider(d, i ? "a2" : "a1", near(x, y)));
      consider(d, "body", distToSeg(pt.x, pt.y, r.seg));
    } else if (d.type === "r") {
      const g = boxXY(S, d);
      if (!g) continue;
      consider(d, "a1", near(g.x1, g.y1));
      consider(d, "a2", near(g.x2, g.y2));
      if (inside(pt, Math.min(g.x1, g.x2), Math.min(g.y1, g.y2), Math.max(g.x1, g.x2), Math.max(g.y1, g.y2))) consider(d, "body", 5);
    } else {
      const g = boxXY(S, d);
      if (!g) continue;
      const top = Math.min(g.yt, g.ys), bot = Math.max(g.yt, g.ys);
      if (pt.x >= g.xl - 4 && pt.x <= g.xr + 4) {
        consider(d, "tp", Math.abs(pt.y - g.yt) - 1);
        consider(d, "sl", Math.abs(pt.y - g.ys) - 1);
        consider(d, "body", Math.abs(pt.y - g.ye));
      }
      if (pt.y >= top && pt.y <= bot) consider(d, "w", Math.abs(pt.x - g.xr) + 0.5);
      consider(d, "w", near(g.xr, g.ye));
      if (inside(pt, g.xl, top, g.xr, bot)) consider(d, "body", 5);
    }
  }
  return best;
}

function localPt(box, e) {
  const r = box.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function setHoverCursor(S, e) {
  const pt = localPt(S.box, e), part = pt.x <= S.layer.width ? hitTest(S, pt)?.part : null;
  S.box.classList.toggle("hov-ns", part === "h" || part === "tp" || part === "sl");
  S.box.classList.toggle("hov-pt", part === "a1" || part === "a2");
  S.box.classList.toggle("hov-ew", part === "w");
  S.box.classList.toggle("hov-move", part === "body");
}

function onPointerDown(S, e) {
  if (mode || e.button !== 0 || !S.ready) return;
  const pt = localPt(S.box, e);
  if (pt.x > S.layer.width) return;
  const hit = hitTest(S, pt);
  if (!hit) { if (selected) select(null); return }
  e.stopPropagation();
  select(hit.d, S.inst);
  drag = { S, d: hit.d, part: hit.part, orig: { ...hit.d }, tp0: pointToTP(S, pt), moved: false };
}

function moveHline(inst, d) {
  const i = drawingsOf(inst).filter(x => x.type === "h").indexOf(d);
  for (const S of slotsOf(inst)) S.hlines[i]?.applyOptions({ price: d.price });
}

window.addEventListener("pointermove", e => {
  if (!drag) return;
  const { S, d, part, orig, tp0 } = drag;
  const tp = pointToTP(S, localPt(S.box, e));
  if (!tp || !tp0) return;
  drag.moved = true;
  if (part === "h") { d.price = tp.p; moveHline(S.inst, d); return }
  const dt = tp.t - tp0.t, dp = tp.p - tp0.p, tick = 10 ** -S.prec, rp = v => +v.toFixed(S.prec);
  const pos = d.type === "L" || d.type === "S", long = d.type === "L";
  if (part === "a1") { d.t1 = tp.t; d.p1 = tp.p }
  else if (part === "a2") { d.t2 = tp.t; d.p2 = tp.p }
  else if (part === "tp") d.tp = rp(long ? Math.max(tp.p, d.entry + tick) : Math.min(tp.p, d.entry - tick));
  else if (part === "sl") d.sl = rp(long ? Math.min(tp.p, d.entry - tick) : Math.max(tp.p, d.entry + tick));
  else if (part === "w") d.t2 = Math.max(tp.t, d.t1 + SEC[S.tf]);
  else if (pos) {
    d.t1 = orig.t1 + dt; d.t2 = orig.t2 + dt;
    d.entry = rp(orig.entry + dp); d.tp = rp(orig.tp + dp); d.sl = rp(orig.sl + dp);
  } else {
    d.t1 = orig.t1 + dt; d.t2 = orig.t2 + dt;
    d.p1 = rp(orig.p1 + dp); d.p2 = rp(orig.p2 + dp);
  }
  repaint(S.inst);
});

window.addEventListener("pointerup", () => {
  if (!drag) return;
  const { moved, S } = drag;
  drag = null;
  if (moved) saveDrawings(S.inst);
});

function newPosition(S, type, tp) {
  const h = S.pane.clientHeight, dir = type === "L" ? 1 : -1, rp = v => +v.toFixed(S.prec);
  const span = Math.abs(S.candle.coordinateToPrice(h * 0.1) - S.candle.coordinateToPrice(h * 0.65)) || tp.p * 0.01;
  return { type, t1: tp.t, t2: tp.t + 20 * SEC[S.tf], entry: tp.p, tp: rp(tp.p + dir * span * 0.2), sl: rp(tp.p - dir * span * 0.1) };
}

function onChartClick(S, param) {
  if (!mode || !param.point || !S.ready) return;
  if (mode === "P") { rpStartAt(S, param.point.x); setMode(null); return }
  const tp = pointToTP(S, param.point);
  if (!tp) return;
  let d;
  if (mode === "h") {
    d = { type: "h", price: tp.p };
  } else if (mode === "L" || mode === "S") {
    d = newPosition(S, mode, tp);
  } else if (!pending || pending.inst !== S.inst) {
    pending = { ...tp, inst: S.inst }; preview = tp; repaint(S.inst);
    return;
  } else {
    d = { type: mode, t1: pending.t, p1: pending.p, t2: tp.t, p2: tp.p };
  }
  drawingsOf(S.inst).push(d);
  saveDrawings(S.inst);
  setMode(null);
  select(d, S.inst);
}

let rpSpeed = RP_SPEEDS.some(([v]) => v === +store.get("okx.rp.speed", "")) ? +store.get("okx.rp.speed", "") : 333;
const nowSec = () => Date.now() / 1000;
const closeOf = (S, b) => b.time - TZ + SEC[S.tf];

function rpStamp(sec) {
  const d = new Date(sec * 1000), y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "";
  return `${y}${d.getMonth() + 1}/${d.getDate()} ${hm(sec * 1000)}`;
}

function toInput(sec) {
  const d = new Date(sec * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function rpTarget() {
  return activeSlot?.rp && slots.includes(activeSlot) ? activeSlot : slots.find(x => x.rp) || null;
}

function setRpUi(S, on) {
  S.el.classList.toggle("replay", on);
  S.chart.applyOptions({ timeScale: { shiftVisibleRangeOnNewBar: !on } });
  if (!on) S.rpAt.textContent = "";
}

function rpPickAt(S, x) {
  const lg = S.chart.timeScale().coordinateToLogical(x);
  if (lg == null) return null;
  const base = S.rp ? S.rp.bars : S.bars, vb = S.rp ? S.rp.vols : S.vols;
  let n = base.length;
  while (n && closeOf(S, base[n - 1]) > nowSec()) n--;
  if (!n) return null;
  return { base, vb, n, i: Math.max(0, Math.min(n - 1, Math.round(lg))) };
}

function moveCut(S, pt) {
  slots.forEach(x => { if (x !== S) x.el.classList.remove("cutting") });
  const k = pt && S.ready ? rpPickAt(S, pt.x) : null;
  S.el.classList.toggle("cutting", !!k);
  if (!k) return;
  const ts = S.chart.timeScale(), c0 = ts.logicalToCoordinate(k.i), c1 = ts.logicalToCoordinate(k.i + 1);
  const x = c0 == null || c1 == null ? pt.x : (c0 + c1) / 2, w = Math.max(0, (S.layer.width || S.box.clientWidth) - x);
  S.cutEl.style.left = x + "px";
  S.cutEl.style.width = w + "px";
  S.cutEl.classList.toggle("flip", w < 170);
  S.cutEl.firstChild.textContent = `여기서 자르기 · ${rpStamp(closeOf(S, k.base[k.i]))}`;
}

function rpShow(S, keep) {
  const range = keep ? S.chart.timeScale().getVisibleLogicalRange() : null;
  if (keep) {
    const h = S.chart.paneSize().height, m = S.candle.priceScale().options().scaleMargins;
    const hi = S.candle.coordinateToPrice(h * m.top), lo = S.candle.coordinateToPrice(h * (1 - m.bottom));
    S.rpFreeze = hi != null && lo != null ? { minValue: lo, maxValue: hi } : null;
  } else S.candle.priceScale().applyOptions({ autoScale: true });
  S.candle.setData(S.bars);
  S.vol.setData(S.vols);
  paintInd(S, true);
  updateMarkers(S);
  setRpUi(S, true);
  rpStatus(S);
  showLbl(S);
  if (range) S.chart.timeScale().setVisibleLogicalRange(range);
  else S.chart.timeScale().scrollToRealTime();
  syncDrawings(S.inst);
}

function rpStartAt(S, x) {
  const k = rpPickAt(S, x);
  if (!k) return;
  rpPause(S);
  const R = S.rp = { T: closeOf(S, k.base[k.i]), bars: k.base.slice(0, k.n), vols: k.vb.slice(0, k.n), fwdDone: false, fwdLoading: false, playT: null };
  S.bars = R.bars.slice(0, k.i + 1);
  S.vols = R.vols.slice(0, k.i + 1);
  rpShow(S, true);
}

async function replayFrom(S, T) {
  if (!S.inst) return;
  T = Math.floor(Math.min(T, nowSec()));
  rpPause(S);
  const g = ++S.gen;
  clearTimeout(S.retryT);
  S.noMore = false; S.loadingOld = false;
  resetSeries(S);
  const R = S.rp = { T, bars: [], vols: [], fwdDone: false, fwdLoading: false, playT: null };
  setRpUi(S, true);
  rpStatus(S);
  S.rpAt.textContent = "불러오는 중…";
  try {
    let rows = [], after = T * 1000 - SEC[S.tf] * 1000 + 1;
    while (rows.length < WARMUP_BARS) {
      const page = await getJson(`${API}/market/history-candles?instId=${S.inst}&bar=${OKX_BAR[S.tf]}&after=${after}&limit=300`);
      if (g !== S.gen) return;
      if (!page.length) break;
      rows = page.slice().reverse().concat(rows);
      after = +page.at(-1)[0];
      await new Promise(r => setTimeout(r, 150));
    }
    if (g !== S.gen) return;
    if (!rows.length) throw new Error(`${rpStamp(T)} 이전 봉이 없어요`);
    const bars = rows.map(r => toBar(r, S.inst));
    R.bars = bars.map(x => x[0]);
    R.vols = bars.map(x => x[1]);
    S.bars = R.bars.slice();
    S.vols = R.vols.slice();
    S.ready = true;
    rpShow(S);
    rpFetchForward(S);
  } catch (e) {
    if (g !== S.gen) return;
    showToast(`리플레이 봉을 받지 못했어요 · ${e.message}`, false);
    loadSlot(S);
  }
}

async function rpFetchForward(S) {
  const R = S.rp, g = S.gen;
  if (!R || R.fwdLoading || R.fwdDone || !R.bars.length || Date.now() - (R.fwdErrAt || 0) < 3000) return;
  R.fwdLoading = true;
  try {
    const iv = SEC[S.tf] * 1000, from = (R.bars.at(-1).time - TZ) * 1000;
    const rows = (await getJson(`${API}/market/history-candles?instId=${S.inst}&bar=${OKX_BAR[S.tf]}&after=${from + 301 * iv}&before=${from}&limit=300`)).slice().reverse();
    if (g !== S.gen || S.rp !== R) return;
    const add = rows.map(r => toBar(r, S.inst)).filter(x => x[0].time > R.bars.at(-1).time && closeOf(S, x[0]) <= nowSec());
    if (!add.length) { R.fwdDone = true; return }
    R.bars.push(...add.map(x => x[0]));
    R.vols.push(...add.map(x => x[1]));
  } catch (e) {
    R.fwdErrAt = Date.now();
  } finally {
    R.fwdLoading = false;
  }
}

function rpStep(S) {
  const R = S.rp;
  if (!R || !S.ready) return false;
  const i = S.bars.length;
  if (R.bars.length - i < 150) rpFetchForward(S);
  const b = R.bars[i];
  if (!b) {
    if (R.fwdDone) { rpPause(S); showToast("지금 봉까지 왔어요 · 끝내기를 누르면 실시간으로 돌아가요", false) }
    return false;
  }
  if (closeOf(S, b) > nowSec()) { rpPause(S); showToast("지금 봉까지 왔어요 · 끝내기를 누르면 실시간으로 돌아가요", false); return false }
  const ts = S.chart.timeScale(), range = ts.getVisibleLogicalRange();
  R.T = closeOf(S, b);
  S.bars.push(b);
  S.vols.push(R.vols[i]);
  S.candle.update(b);
  S.vol.update(R.vols[i]);
  paintInd(S, false);
  if (range) ts.setVisibleLogicalRange(i > range.to - 2 ? { from: range.from + 1, to: range.to + 1 } : range);
  rpStatus(S);
  return true;
}

function rpPause(S) {
  if (!S.rp) return;
  clearInterval(S.rp.playT);
  S.rp.playT = null;
  rpStatus(S);
}

function rpToggle(S) {
  const R = S.rp;
  if (!R || !S.ready) return;
  if (R.playT) { rpPause(S); return }
  R.playT = setInterval(() => { if (S.rp === R) rpStep(S); else clearInterval(R.playT) }, rpSpeed);
  rpStatus(S);
}

function rpStatus(S) {
  const R = S.rp;
  if (!R) return;
  S.rpPlay.textContent = R.playT ? "⏸ 멈춤" : "▶ 재생";
  S.rpPlay.classList.toggle("on", !!R.playT);
  S.rpAt.textContent = `${rpStamp(R.T)} 까지`;
  S.rpDate.max = toInput(nowSec());
  if (document.activeElement !== S.rpDate) S.rpDate.value = toInput(R.T);
  const last = S.bars.at(-1);
  if (!last) return;
  setPriceText(S, last.close);
  const from = last.time + SEC[S.tf] - 86400;
  let lo = 0, hi = S.bars.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (S.bars[m].time < from) lo = m + 1; else hi = m }
  setChange(S, last.close, S.bars[lo].open);
  if (!S.hover) showLbl(S);
  drawSpark(S);
}

function wireReplayBar(S) {
  S.rpSpeedEl.value = String(rpSpeed);
  S.el.querySelector(".rpb").addEventListener("click", e => {
    const b = e.target.closest("button[data-rp]");
    if (!b) return;
    b.blur();
    const a = b.dataset.rp;
    if (a === "pick") setMode(mode === "P" ? null : "P");
    else if (a === "play") rpToggle(S);
    else if (a === "step") { rpPause(S); rpStep(S) }
    else if (a === "end") loadSlot(S);
  });
  S.rpSpeedEl.addEventListener("change", () => {
    rpSpeed = +S.rpSpeedEl.value;
    store.set("okx.rp.speed", String(rpSpeed));
    S.rpSpeedEl.blur();
    for (const x of slots) {
      x.rpSpeedEl.value = String(rpSpeed);
      if (x.rp?.playT) { rpPause(x); rpToggle(x) }
    }
  });
  let t = null;
  S.rpDate.addEventListener("change", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const sec = Math.floor(new Date(S.rpDate.value).getTime() / 1000);
      if (S.rp && Number.isFinite(sec) && sec !== S.rp.T) replayFrom(S, sec);
    }, 700);
  });
}

let universe = [], uniP = null, uniAt = 0;

function loadUniverse() {
  if (uniP && Date.now() - uniAt < 300000) return uniP;
  uniAt = Date.now();
  uniP = (async () => {
    const [sp, sw] = await Promise.all(["SPOT", "SWAP"].map(t => getJson(`${API}/market/tickers?instType=${t}`).catch(() => [])));
    const quote = id => id.split("-")[1] || "";
    universe = [
      ...sp.map(t => ({ id: t.instId, type: "현물", last: +t.last, open: +t.open24h, usd: /^USD/.test(quote(t.instId)) ? +t.volCcy24h : 0 })),
      ...sw.map(t => ({ id: t.instId, type: "무기한", last: +t.last, open: +t.open24h, usd: +t.volCcy24h * +t.last }))
    ];
    for (const u of universe) u.base = u.id.split("-")[0];
    if (!universe.length) uniAt = 0;
    return universe;
  })();
  return uniP;
}

function search(q) {
  q = q.trim().toUpperCase();
  if (!q) return [];
  const tier = u =>
    u.id === q ? 0 :
    u.base === q || u.base === "X" + q ? 1 :
    u.base.startsWith(q) || u.base.startsWith("X" + q) ? 2 :
    u.id.includes(q) ? 3 : 9;
  return universe.map(u => [tier(u), u]).filter(x => x[0] < 9)
    .sort((a, b) => a[0] - b[0] || b[1].usd - a[1].usd)
    .slice(0, 15).map(x => x[1]);
}

async function resolveInst(v) {
  if (v.includes("-")) return v;
  for (const id of [v + "-USDT", v + "-USDT-SWAP", "X" + v + "-USDT"]) {
    try { if ((await getJson(`${API}/market/ticker?instId=${id}`)).length) return id } catch (e) {}
  }
  return v + "-USDT";
}

function suggHtml(list, selIdx) {
  return list.length ? list.map((u, i) => {
    const pc = u.open ? (u.last - u.open) / u.open * 100 : 0;
    return `<div class="it${i === selIdx ? " sel" : ""}" data-i="${i}"><span class="id">${esc(u.id)}</span><span class="tag">${u.type}</span>` +
      `<span class="ipx">${u.last.toLocaleString("en-US", { maximumSignificantDigits: 6 })}</span>` +
      `<span class="ipc" style="color:${pc >= 0 ? C("--up") : C("--down")}">${pctStr(pc)}</span></div>`;
  }).join("") : '<div class="it none">일치하는 종목 없음</div>';
}

function renderSugg(S, show) {
  if (!show) { S.suggEl.classList.remove("open"); return }
  S.suggEl.innerHTML = suggHtml(S.sugg, S.selIdx);
  S.suggEl.classList.add("open");
}

function pickInst(S, id) {
  S.sugg = [];
  renderSugg(S, false);
  S.symEl.blur();
  if (id === S.inst) return;
  if (selectedInst === S.inst) select(null);
  S.inst = id;
  saveSlots();
  loadSlot(S);
  syncSubs();
}

function wireSymbolInput(S) {
  const el = S.symEl;
  el.addEventListener("focus", () => { el.select(); loadUniverse() });
  el.addEventListener("blur", () => { S.sugg = []; renderSugg(S, false); el.value = S.inst || "" });
  el.addEventListener("input", async () => {
    await loadUniverse();
    S.sugg = search(el.value);
    S.selIdx = 0;
    renderSugg(S, !!el.value.trim());
  });
  el.addEventListener("keydown", async e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!S.sugg.length) return;
      e.preventDefault();
      S.selIdx = (S.selIdx + (e.key === "ArrowDown" ? 1 : -1) + S.sugg.length) % S.sugg.length;
      renderSugg(S, true);
      S.suggEl.children[S.selIdx]?.scrollIntoView({ block: "nearest" });
      return;
    }
    if (e.key === "Escape") { el.blur(); return }
    if (e.key !== "Enter") return;
    const v = el.value.trim().toUpperCase();
    if (!v) return;
    pickInst(S, S.sugg[S.selIdx]?.id || await resolveInst(v));
  });
  S.suggEl.addEventListener("mousedown", e => {
    const it = e.target.closest(".it[data-i]");
    if (!it) return;
    e.preventDefault();
    pickInst(S, S.sugg[+it.dataset.i].id);
  });
}

const clampInt = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d };

function onColor(e) {

}

const ALERT_TFS = ["1m", "5m", "15m", "1h"];
const SOUNDS = ["Glass", "Ping", "Hero", "Submarine", "Funk", "Pop", "Purr", "Tink", "Blow", "Bottle", "Frog", "Morse", "Basso", "Sosumi"];
let alertCfg = (() => {
  try { const v = JSON.parse(store.get("okx.alert", "")); if (v && Array.isArray(v.tfs) && Array.isArray(v.watch)) return v } catch (e) {}
  return { on: false, n: 5, tfs: ["5m", "15m"], slots: true, watch: [], banner: true, sound: true, soundName: "Glass" };
})();
let alertLog = (() => {
  try { const v = JSON.parse(store.get("okx.alert.log", "")); if (Array.isArray(v)) return v } catch (e) {}
  return [];
})();
let alertUnseen = 0, alSugg = [], alSel = 0, watchChain = Promise.resolve();
const watchers = new Map();
const alp = $("alp");

const post = m => { try { window.webkit.messageHandlers.win.postMessage(m); return true } catch (e) { return false } };
const saveAlert = () => store.set("okx.alert", JSON.stringify(alertCfg));
const hm = ms => new Date(ms).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const watchBar = (r, inst) => ({ ts: +r[0], c: +r[4], v: +r[volIdx(inst)] });

function whenStr(ms) {
  const d = new Date(ms).toDateString(), now = Date.now();
  if (d === new Date(now).toDateString()) return hm(ms);
  if (d === new Date(now - 864e5).toDateString()) return "어제 " + hm(ms);
  const t = new Date(ms);
  return `${t.getMonth() + 1}/${t.getDate()} ${hm(ms)}`;
}

function activeMAs() {
  return ind.ma.map((m, k) => ({ ...m, k })).filter(m => m.on).sort((a, b) => a.n - b.n);
}

function maChain(ms) {
  return ms.map((m, i) => i && m.type === ms[i - 1].type ? m.n : m.type + m.n).join(" > ");
}

function needBars() {
  const ms = activeMAs();
  return Math.min(1500, Math.max(300, (ms.length ? ms.at(-1).n : 0) * 3 + alertCfg.n + 10));
}

function alertInsts() {
  if (!alertCfg.on || !alertCfg.tfs.length) return [];
  return [...new Set([...(alertCfg.slots ? slots.map(S => S.inst).filter(Boolean) : []), ...alertCfg.watch])];
}

function refreshWatchers() {
  const want = new Set(alertInsts().flatMap(inst => alertCfg.tfs.map(tf => `${tf}|${inst}`)));
  for (const [k, W] of watchers) {
    if (want.has(k)) continue;
    W.gen++;
    clearTimeout(W.retryT);
    watchers.delete(k);
  }
  for (const k of want) {
    if (watchers.has(k)) continue;
    const [tf, inst] = k.split("|");
    const W = { tf, inst, bars: [], gen: 0, ready: false, full: false, lastEval: 0, catching: false, retryT: null };
    watchers.set(k, W);
    queueLoad(W);
  }
  const insts = alertInsts();
  for (const S of slots) {
    const on = !!S.inst && insts.includes(S.inst);
    S.el.classList.toggle("watched", on);
    S.bellEl.title = on ? `정배열 알림 감시 중 (${alertCfg.tfs.join("·")})` : "";
  }
}

function queueLoad(W) {
  watchChain = watchChain.then(() => loadWatcher(W)).catch(() => {});
}

function topUpWatchers() {
  for (const W of watchers.values()) if (W.ready && !W.full && W.bars.length < needBars()) queueLoad(W);
}

async function loadWatcher(W) {
  const g = ++W.gen;
  clearTimeout(W.retryT);
  try {
    const rows = (await getJson(`${API}/market/candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&limit=300`)).filter(r => r[8] === "1");
    let bars = rows.reverse().map(r => watchBar(r, W.inst)), full = false;
    while (g === W.gen && bars.length && bars.length < needBars()) {
      await new Promise(r => setTimeout(r, 200));
      const older = (await getJson(`${API}/market/history-candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&after=${bars[0].ts}&limit=300`))
        .reverse().map(r => watchBar(r, W.inst)).filter(b => b.ts < bars[0].ts);
      if (!older.length) { full = true; break }
      bars = older.concat(bars);
    }
    if (g !== W.gen) return;
    W.bars = bars;
    W.full = full;
    W.lastEval = Math.max(W.lastEval, bars.at(-1)?.ts || 0);
    W.ready = true;
  } catch (e) {
    if (g === W.gen) W.retryT = setTimeout(() => { if (watchers.get(`${W.tf}|${W.inst}`) === W) queueLoad(W) }, 30000);
  }
}

function onWatchBar(W, r) {
  const ts = +r[0], last = W.bars.at(-1), iv = SEC[W.tf] * 1000;
  if (r[8] !== "1") { if (last && ts > last.ts + iv) catchUp(W); return }
  if (last && ts <= last.ts) return;
  if (last && ts > last.ts + iv) { catchUp(W); return }
  W.bars.push(watchBar(r, W.inst));
  trimWatcher(W);
  evalWatcher(W);
}

function trimWatcher(W) {
  const keep = needBars() + 200;
  if (W.bars.length > keep) W.bars.splice(0, W.bars.length - keep);
}

async function catchUp(W) {
  if (W.catching || !W.ready) return;
  W.catching = true;
  const g = W.gen;
  try {
    const rows = (await getJson(`${API}/market/candles?instId=${W.inst}&bar=${OKX_BAR[W.tf]}&limit=20`)).filter(r => r[8] === "1").reverse();
    if (g !== W.gen) return;
    const last = W.bars.at(-1), add = rows.map(r => watchBar(r, W.inst)).filter(b => !last || b.ts > last.ts);
    if (!add.length) return;
    if (last && add[0].ts > last.ts + SEC[W.tf] * 1000) { queueLoad(W); return }
    W.bars.push(...add);
    trimWatcher(W);
    evalWatcher(W);
  } catch (e) {
  } finally {
    W.catching = false;
  }
}

function alignedAt(lines, i, n) {
  for (let j = 0; j < lines.length; j++) {
    const v = lines[j][i], p = lines[j][i - n];
    if (v == null || p == null || !(v > p)) return false;
    if (j && !(lines[j - 1][i] > v)) return false;
  }
  return true;
}

function evalWatcher(W) {
  const ms = activeMAs(), i = W.bars.length - 1;
  if (ms.length < 2 || i <= alertCfg.n) return;
  const ts = W.bars[i].ts;
  if (ts <= W.lastEval) return;
  W.lastEval = ts;
  const cl = W.bars.map(b => b.c), vl = W.bars.map(b => b.v);
  const lines = ms.map(m => m.type === "EMA" ? ema(cl, m.n) : m.type === "VWMA" ? vwma(cl, vl, m.n) : sma(cl, m.n));
  if (alignedAt(lines, i, alertCfg.n) && !alignedAt(lines, i - 1, alertCfg.n)) fireAlert(W, ms, cl[i], ts);
}

function fireAlert(W, ms, close, ts) {
  const at = ts + SEC[W.tf] * 1000, px = close.toLocaleString("en-US", { maximumSignificantDigits: 6 });
  alertLog.unshift({ inst: W.inst, tf: W.tf, ts, at, px });
  alertLog.length = Math.min(alertLog.length, 30);
  store.set("okx.alert.log", JSON.stringify(alertLog));
  const title = `${W.inst} · ${W.tf} 정배열`;
  post({ notify: {
    title, body: `${maChain(ms)}, 모두 ${alertCfg.n}봉 전보다 위\n${hm(at)} 봉 마감 · 종가 ${px}`,
    inst: W.inst, tf: W.tf, banner: !!alertCfg.banner, sound: alertCfg.sound ? alertCfg.soundName : ""
  } });
  showToast(`${title} · ${hm(at)} 봉 마감 · ${px}`, false);
  if (alp.classList.contains("open")) renderAlertPanel();
  else { alertUnseen++; updateAlertBadge() }
  slotsOf(W.inst).forEach(updateMarkers);
}

function updateMarkers(S) {
  if (!S.inst || !S.bars.length) { S.candle.setMarkers([]); return }
  const times = new Set(alertLog.filter(e => e.inst === S.inst && e.tf === S.tf).map(e => Math.floor(e.ts / 1000) + TZ)
    .filter(t => idxOfTime(S.bars, t) >= 0));
  S.candle.setMarkers([...times].sort((a, b) => a - b).map(t => ({
    time: t, position: "belowBar", color: C("--draw"), shape: "arrowUp", text: "정배열 " + hm((t - TZ + SEC[S.tf]) * 1000)
  })));
}

function updateAlertBadge() {
  $("alBadge").textContent = alertUnseen > 9 ? "9+" : alertUnseen;
  $("alBadge").classList.toggle("on", alertUnseen > 0);
}

function renderAlertPanel() {
  const ms = activeMAs(), nSlots = new Set(slots.map(S => S.inst).filter(Boolean)).size, chk = v => v ? " checked" : "";
  alp.innerHTML =
    `<div class="hd"><b>정배열 알림</b><label class="k">켜기<input type="checkbox" data-f="on"${chk(alertCfg.on)}></label></div>` +
    `<div class="sec first"><span class="k">조건</span>` +
    (ms.length >= 2
      ? `<div class="chips">${ms.map((m, i) => `${i ? '<span class="k">&gt;</span>' : ""}<span class="chip"><i style="background:${maColor(m.k)}"></i>${m.type}${m.n}</span>`).join("")}</div>`
      : '<span class="warn">지표에서 이동평균을 2개 이상 켜야 알림이 울려요</span>') +
    `<span class="k">짧은 선이 위에 오는 순서(정배열). 지표에서 켠 이동평균을 그대로 씁니다.</span>` +
    `<label>우상향: 모든 선이<input type="number" min="1" max="50" data-f="n" value="${alertCfg.n}">봉 전보다 높음</label>` +
    `<span class="k">봉이 마감될 때 판정하고, 조건이 새로 맞은 순간 한 번만 울립니다.</span></div>` +
    `<div class="sec"><span class="k">봉 간격</span><div class="chips">` +
    ALERT_TFS.map(tf => `<label class="tfc${alertCfg.tfs.includes(tf) ? " on" : ""}"><input type="checkbox" data-f="tf" data-v="${tf}"${chk(alertCfg.tfs.includes(tf))}>${tf}</label>`).join("") +
    `</div></div>` +
    `<div class="sec"><span class="k">대상 종목</span>` +
    `<label><input type="checkbox" data-f="slots"${chk(alertCfg.slots)}>칸에 띄운 종목 <span class="k">(${nSlots}개, 칸의 봉 간격이 아니라 위 간격으로 봄)</span></label>` +
    `<span class="k">감시 목록 (칸에 없어도 봄)</span><div class="wl">` +
    alertCfg.watch.map((id, i) => `<div class="wr"><b>${esc(id)}</b><span class="k" data-px="${esc(id)}"></span><button class="x" data-rm="${i}" title="감시 목록에서 빼기">×</button></div>`).join("") +
    `<input type="text" id="alAdd" spellcheck="false" autocomplete="off" placeholder="＋ 종목 추가 (예: sam, koru)"><div class="sugg"></div></div></div>` +
    `<div class="sec"><span class="k">알림 방법</span><div class="chips" style="gap:10px">` +
    `<label><input type="checkbox" data-f="banner"${chk(alertCfg.banner)}>맥 알림 배너</label>` +
    `<label><input type="checkbox" data-f="sound"${chk(alertCfg.sound)}>소리</label>` +
    `<select data-f="soundName" title="알림 소리">${SOUNDS.map(s => `<option${s === alertCfg.soundName ? " selected" : ""}>${s}</option>`).join("")}</select>` +
    `<button class="test" data-act="test" title="지금 설정으로 시험 알림을 한 번 보냅니다">시험</button></div></div>` +
    `<div class="sec"><span class="k">최근 알림 · 누르면 그 종목을 선택한 칸에 띄움</span>` +
    (alertLog.length
      ? alertLog.slice(0, 5).map((e, i) => `<div class="rec" data-i="${i}"><span class="w">${whenStr(e.at)}</span><span class="id">${esc(e.inst)}</span><span class="tag">${e.tf}</span><span class="p">${esc(e.px)}</span></div>`).join("")
      : '<span class="k">아직 없음</span>') +
    `</div>`;
  fillWatchPrices();
}

async function fillWatchPrices() {
  await loadUniverse();
  for (const el of alp.querySelectorAll("[data-px]")) {
    const u = universe.find(x => x.id === el.dataset.px);
    if (u) el.textContent = u.last.toLocaleString("en-US", { maximumSignificantDigits: 6 });
  }
}

function renderAlSugg(show) {
  const box = alp.querySelector(".wl .sugg");
  if (!box) return;
  if (!show) { box.classList.remove("open"); return }
  box.innerHTML = suggHtml(alSugg, alSel);
  box.classList.add("open");
}

function addWatch(id) {
  alSugg = [];
  if (id && !alertCfg.watch.includes(id)) { alertCfg.watch.push(id); saveAlert(); syncSubs() }
  renderAlertPanel();
  $("alAdd")?.focus();
}

function closeAlertPanel() {
  alp.classList.remove("open");
  $("alBtn").classList.remove("active");
}

window.openAlert = (inst, tf) => {
  if (!inst) return;
  closeAlertPanel();
  let S = slots.find(x => x.inst === inst && x.tf === tf) || slots.find(x => x.inst === inst);
  if (!S) S = activeSlot && slots.includes(activeSlot) ? activeSlot : slots[0];
  const change = S.inst !== inst || (BARS.includes(tf) && S.tf !== tf);
  if (change) {
    if (selectedInst === S.inst) select(null);
    S.inst = inst;
    if (BARS.includes(tf)) { S.tf = tf; S.tfEl.value = tf; S.chart.applyOptions({ timeScale: { timeVisible: tf !== "1d" } }) }
    saveSlots();
    loadSlot(S);
    syncSubs();
  }
  activeSlot = S;
  if (S.collapsed) setCollapsed(S, false);
  S.el.scrollIntoView({ block: "nearest" });
};
window.notifyDenied = () => showToast("맥 알림이 막혀 있어요 · 시스템 설정 > 알림에서 OKX Mini Chart 를 허용하세요", false);

$("alBtn").onclick = () => {
  if (alp.classList.contains("open")) { closeAlertPanel(); return }
  closeTop();
  indp.classList.remove("open");
  $("indBtn").classList.remove("active");
  alertUnseen = 0;
  updateAlertBadge();
  renderAlertPanel();
  alp.classList.add("open");
  $("alBtn").classList.add("active");
};

document.addEventListener("mousedown", e => {
  if (alp.classList.contains("open") && !alp.contains(e.target) && !$("alBtn").contains(e.target)) closeAlertPanel();
});

alp.addEventListener("change", e => {
  const t = e.target, f = t.dataset.f;
  if (f === "on") { alertCfg.on = t.checked; if (alertCfg.on && alertCfg.banner) post({ notifyAuth: true }) }
  else if (f === "n") alertCfg.n = clampInt(t.value, 1, 50, alertCfg.n);
  else if (f === "tf") alertCfg.tfs = ALERT_TFS.filter(x => x === t.dataset.v ? t.checked : alertCfg.tfs.includes(x));
  else if (f === "slots") alertCfg.slots = t.checked;
  else if (f === "banner") { alertCfg.banner = t.checked; if (t.checked) post({ notifyAuth: true }) }
  else if (f === "sound") alertCfg.sound = t.checked;
  else if (f === "soundName") { alertCfg.soundName = t.value; post({ sound: t.value }) }
  else return;
  saveAlert();
  renderAlertPanel();
  syncSubs();
  topUpWatchers();
});

alp.addEventListener("input", async e => {
  if (e.target.id !== "alAdd") return;
  await loadUniverse();
  alSugg = search(e.target.value).filter(u => !alertCfg.watch.includes(u.id));
  alSel = 0;
  renderAlSugg(!!e.target.value.trim());
});

alp.addEventListener("focusin", e => { if (e.target.id === "alAdd") loadUniverse() });
alp.addEventListener("focusout", e => { if (e.target.id === "alAdd") renderAlSugg(false) });

alp.addEventListener("keydown", async e => {
  if (e.target.id !== "alAdd") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!alSugg.length) return;
    e.preventDefault();
    alSel = (alSel + (e.key === "ArrowDown" ? 1 : -1) + alSugg.length) % alSugg.length;
    renderAlSugg(true);
    return;
  }
  if (e.key === "Escape") { e.target.blur(); return }
  if (e.key !== "Enter") return;
  const v = e.target.value.trim().toUpperCase();
  if (v) addWatch(alSugg[alSel]?.id || await resolveInst(v));
});

alp.addEventListener("mousedown", e => {
  const it = e.target.closest(".sugg .it[data-i]");
  if (!it) return;
  e.preventDefault();
  addWatch(alSugg[+it.dataset.i].id);
});

alp.addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { alertCfg.watch.splice(+rm.dataset.rm, 1); saveAlert(); renderAlertPanel(); syncSubs(); return }
  if (e.target.closest("[data-act=test]")) {
    const ms = activeMAs();
    const ok = post({ notify: {
      title: "정배열 알림 시험", body: `${ms.length >= 2 ? maChain(ms) : "이동평균 2개 이상 필요"}, 모두 ${alertCfg.n}봉 전보다 위\n실제 알림은 이렇게 옵니다`,
      inst: "", tf: "", banner: !!alertCfg.banner, sound: alertCfg.sound ? alertCfg.soundName : ""
    } });
    if (!ok) showToast("맥 알림은 앱에서만 돼요", false);
    return;
  }
  const rec = e.target.closest(".rec[data-i]");
  if (rec) { const r = alertLog[+rec.dataset.i]; if (r) openAlert(r.inst, r.tf) }
});

function watchdog() {
  const now = Date.now();
  for (const W of watchers.values()) {
    const last = W.bars.at(-1);
    if (W.ready && last && now >= last.ts + 2 * SEC[W.tf] * 1000 + 3000) catchUp(W);
  }
}

for (const cfg of loadSlotConfig()) slots.push(makeSlot(cfg));
activeSlot = slots[0];
layout();
refreshWatchers();
slots.forEach(loadSlot);
connect();
setInterval(() => { refreshTicker(); if (topp.classList.contains("open")) renderTop() }, 10000);
setInterval(watchdog, 20000);
</script>
