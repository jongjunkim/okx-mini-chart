<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKX 차트</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1115;--panel:#161a21;--line:#232831;--text:#d6dae1;--muted:#7d8592;--up:#f04452;--down:#3182f6;--draw:#e0b341}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
body{display:flex;flex-direction:column}
header{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
#sugg{position:absolute;left:8px;top:32px;width:min(360px,calc(100vw - 16px));max-height:60vh;overflow:auto;background:var(--panel);border:1px solid #3a414d;border-radius:6px;z-index:20;display:none;box-shadow:0 8px 24px #0009}
#sugg.open{display:block}
.it{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer}
.it.sel{background:#232a36}
.it[data-i]:hover{background:#1d232d}
.it .id{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
.it .px{color:var(--muted);font-variant-numeric:tabular-nums}
.it .pc{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.it.empty{color:var(--muted);cursor:default}
#sym{width:150px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:3px 6px;border-radius:4px;font:inherit;text-transform:uppercase}
#price{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
#chg{font-variant-numeric:tabular-nums}
#dot{width:7px;height:7px;border-radius:50%;background:#555;margin-left:auto;flex:none}
#dot.on{background:#2fbf71}
nav{position:relative;display:flex;gap:3px;padding:4px 8px}
nav button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:3px 0;border-radius:4px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--text);border-color:#4a5262}
nav button.tool{flex:none;padding:3px 7px}
nav button.tool.active{color:var(--draw);border-color:var(--draw)}
nav .sep{flex:none;width:5px}
#hint{display:none;position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:10;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;background:#161a21eb;border:1px solid var(--draw);border-radius:4px;padding:3px 8px;color:var(--draw);font-size:11px}
body.hinting #hint{display:block}
body.drawing .c *{cursor:crosshair!important}
.c.hov-ns *{cursor:ns-resize!important}
.c.hov-pt *{cursor:pointer!important}
.c.hov-move *{cursor:move!important}
#indp{position:absolute;right:8px;top:100%;margin-top:2px;width:236px;background:var(--panel);border:1px solid #3a414d;border-radius:6px;padding:6px 8px;z-index:30;display:none;box-shadow:0 8px 24px #0009}
#indp.open{display:block}
#indp .row{display:flex;align-items:center;gap:6px;padding:3px 0}
#indp label{display:flex;align-items:center;gap:4px;cursor:pointer}
#indp input[type=color]{width:26px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;flex:none}
#indp input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
#indp input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
#indp select,#indp input[type=number]{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:2px 4px}
#indp select,#indp .nm{width:72px}
#indp input[type=number]{width:52px}
#indp .foot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
#indp button{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit;padding:4px;cursor:pointer}
#indp button:disabled{color:var(--muted);cursor:default}
main{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.pane{position:relative;flex:1;min-height:0;border-top:1px solid var(--line)}
.pane.hidden{display:none}
.lbl{position:absolute;left:6px;top:4px;z-index:3;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl b{color:var(--text);font-weight:600;margin-right:6px}
.lbl .ind{font-size:10px;margin-top:1px}
.lbl .ind span{margin-right:8px}
.c{position:absolute;inset:0}
</style>
</head>
<body>
<header>
  <input id="sym" spellcheck="false" autocomplete="off" title="예: BTC-USDT, ETH-USDT-SWAP (Enter)">
  <span id="price">-</span><span id="chg"></span><span id="dot" title="실시간 연결"></span>
  <div id="sugg"></div>
</header>
<nav>
  <button data-v="1m">1m</button><button data-v="5m">5m</button><button data-v="15m">15m</button><button data-v="1h">1h</button><button data-v="4h">4h</button><button data-v="1d">1d</button>
  <span class="sep"></span>
  <button class="tool" data-mode="h" title="수평선(지지·저항): 누른 뒤 차트를 클릭. 그린 선은 클릭해서 끌면 옮겨지고 Backspace 로 지웁니다">수평</button><button class="tool" data-mode="t" title="추세선: 누른 뒤 차트에서 두 점을 클릭. 끝점을 끌면 기울기, 선을 끌면 위치가 바뀌고 Backspace 로 지웁니다">추세</button><button class="tool" id="indBtn" title="이동평균·볼린저밴드">지표</button>
  <div id="indp"></div>
</nav>
<main id="main"><div id="hint"></div></main>
<script>
const OKX_BAR = { "1m": "1m", "5m": "5m", "15m": "15m", "1h": "1H", "4h": "4H", "1d": "1D" };
const SEC = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };
const BARS = Object.keys(OKX_BAR);
const BAR_OF = Object.fromEntries(BARS.map(b => [OKX_BAR[b], b]));
const API = "https://www.okx.com/api/v5";
const TZ = -new Date().getTimezoneOffset() * 60;
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const MA_COLORS = ["#f5c542", "#c77dff", "#2ec4b6", "#ff8c42"];
const BB_COLOR = "#8a94a6";
const maColor = k => ind.ma[k].color || MA_COLORS[k];
const bbColor = () => ind.bb.color || BB_COLOR;
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
};
const $ = id => document.getElementById(id);

let inst = store.get("okx.inst", "BTC-USDT");
let shown = (() => {
  try { const v = JSON.parse(store.get("okx.shown", "")).filter(b => BARS.includes(b)); if (v.length) return v } catch (e) {}
  return ["1m", "5m", "15m"];
})();
let ind = (() => {
  try { const v = JSON.parse(store.get("okx.ind", "")); if (v && v.ma && v.bb) return v } catch (e) {}
  return {
    ma: [{ on: false, type: "SMA", n: 5 }, { on: true, type: "SMA", n: 20 }, { on: true, type: "SMA", n: 60 }, { on: false, type: "SMA", n: 120 }],
    bb: { on: false, n: 20, k: 2 }
  };
})();
let drawings = [], mode = null, pending = null, preview = null, selected = null, drag = null;
let ws, pingT, retryT, tickT, gen = 0, pricePrec = 2;
const panes = {};

const isDeriv = () => /-SWAP$|-\d{6}$/.test(inst);
const volIdx = () => isDeriv() ? 6 : 5;
const fv = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(2) + "K" : v.toFixed(v < 10 ? 4 : 2);
const fp = v => v.toLocaleString("en-US", { minimumFractionDigits: pricePrec, maximumFractionDigits: pricePrec });

function toBar(r) {
  const t = Math.floor(+r[0] / 1000) + TZ, o = +r[1], c = +r[4];
  return [
    { time: t, open: o, high: +r[2], low: +r[3], close: c },
    { time: t, value: +r[volIdx()], color: (c >= o ? C("--up") : C("--down")) + "80" }
  ];
}

function sma(cl, n) {
  const out = new Array(cl.length).fill(null);
  let s = 0;
  for (let i = 0; i < cl.length; i++) {
    s += cl[i];
    if (i >= n) s -= cl[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}

function vwma(cl, vl, n) {
  const out = new Array(cl.length).fill(null);
  let pv = 0, v = 0;
  for (let i = 0; i < cl.length; i++) {
    pv += cl[i] * vl[i]; v += vl[i];
    if (i >= n) { pv -= cl[i - n] * vl[i - n]; v -= vl[i - n] }
    if (i >= n - 1 && v > 0) out[i] = pv / v;
  }
  return out;
}

function ema(cl, n) {
  const out = new Array(cl.length).fill(null), k = 2 / (n + 1);
  let e = null;
  for (let i = n - 1; i < cl.length; i++) {
    if (i === n - 1) { e = 0; for (let j = 0; j < n; j++) e += cl[j]; e /= n }
    else e = cl[i] * k + e * (1 - k);
    out[i] = e;
  }
  return out;
}

function bollinger(cl, n, k) {
  const mid = sma(cl, n), up = [], lo = [];
  for (let i = 0; i < cl.length; i++) {
    if (mid[i] == null) { up.push(null); lo.push(null); continue }
    let v = 0;
    for (let j = i - n + 1; j <= i; j++) v += (cl[j] - mid[i]) ** 2;
    const sd = Math.sqrt(v / n);
    up.push(mid[i] + k * sd); lo.push(mid[i] - k * sd);
  }
  return [up, mid, lo];
}

function idxOfTime(bars, t) {
  let lo = 0, hi = bars.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (bars[m].time === t) return m;
    if (bars[m].time < t) lo = m + 1; else hi = m - 1;
  }
  return -1;
}

function timeToX(P, b, t) {
  const bars = P.bars, n = bars.length;
  if (!n) return null;
  let lg;
  if (t <= bars[0].time) lg = (t - bars[0].time) / SEC[b];
  else if (t >= bars[n - 1].time) lg = n - 1 + (t - bars[n - 1].time) / SEC[b];
  else {
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (bars[m].time <= t) lo = m; else hi = m }
    lg = lo + (t - bars[lo].time) / (bars[hi].time - bars[lo].time);
  }
  return P.chart.timeScale().logicalToCoordinate(lg);
}

function pointToTP(P, b, pt) {
  const lg = P.chart.timeScale().coordinateToLogical(pt.x), p = P.candle.coordinateToPrice(pt.y), n = P.bars.length;
  if (lg == null || p == null || !n) return null;
  const i = Math.round(lg);
  const t = i < 0 ? P.bars[0].time + i * SEC[b] : i >= n ? P.bars[n - 1].time + (i - n + 1) * SEC[b] : P.bars[i].time;
  return { t, p: +p.toFixed(pricePrec) };
}

function rayXY(P, b, d, width) {
  let x1 = timeToX(P, b, d.t1), x2 = timeToX(P, b, d.t2);
  let y1 = P.candle.priceToCoordinate(d.p1), y2 = P.candle.priceToCoordinate(d.p2);
  if ([x1, x2, y1, y2].some(v => v == null)) return null;
  const anchors = [[x1, y1], [x2, y2]];
  if (x2 < x1) [x1, y1, x2, y2] = [x2, y2, x1, y1];
  if (x2 - x1 < 0.5) return { seg: [x1, y1, x2, y2], anchors };
  return { seg: [x1, y1, width, y1 + (y2 - y1) * (width - x1) / (x2 - x1)], anchors };
}

function distToSeg(px, py, [x1, y1, x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  const u = l ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)) : 0;
  return Math.hypot(px - (x1 + u * dx), py - (y1 + u * dy));
}

class TrendLines {
  constructor(P, b) {
    this.P = P; this.b = b; this.width = 0;
    this.view = { renderer: () => ({ draw: target => this.draw(target) }) };
  }
  attached({ requestUpdate }) { this.requestUpdate = requestUpdate }
  detached() { this.requestUpdate = null }
  updateAllViews() {}
  paneViews() { return [this.view] }
  draw(target) {
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
      this.width = mediaSize.width;
      const items = drawings.filter(d => d.type === "t").map(d => [d, false]);
      if (pending) items.push([{ t1: pending.t, p1: pending.p, t2: (preview || pending).t, p2: (preview || pending).p }, true]);
      ctx.save();
      ctx.strokeStyle = ctx.fillStyle = C("--draw");
      for (const [d, temp] of items) {
        const r = rayXY(this.P, this.b, d, mediaSize.width);
        if (!r) continue;
        const sel = d === selected;
        ctx.lineWidth = sel ? 2.5 : 1.5;
        ctx.setLineDash(temp ? [4, 4] : []);
        ctx.beginPath(); ctx.moveTo(r.seg[0], r.seg[1]); ctx.lineTo(r.seg[2], r.seg[3]); ctx.stroke();
        ctx.setLineDash([]);
        for (const [x, y] of r.anchors) {
          ctx.beginPath(); ctx.arc(x, y, sel ? 4.5 : 2.5, 0, Math.PI * 2);
          if (sel) { ctx.fillStyle = C("--bg"); ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = C("--draw") }
          else ctx.fill();
        }
      }
      ctx.restore();
    });
  }
}

const lineOpts = color => ({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });

for (const b of BARS) {
  const el = document.createElement("div");
  el.className = "pane";
  el.innerHTML = '<div class="lbl"></div><div class="c"></div>';
  $("main").appendChild(el);
  const chart = LightweightCharts.createChart(el.querySelector(".c"), {
    autoSize: true,
    layout: { background: { color: C("--bg") }, textColor: C("--muted"), fontSize: 10, attributionLogo: false },
    grid: { vertLines: { color: C("--line") }, horzLines: { color: C("--line") } },
    rightPriceScale: { borderColor: C("--line") },
    timeScale: { borderColor: C("--line"), timeVisible: b !== "1d", secondsVisible: false, rightOffset: 3 },
    crosshair: { mode: 0 }
  });
  const candle = chart.addCandlestickSeries({
    upColor: C("--up"), downColor: C("--down"), borderVisible: false,
    wickUpColor: C("--up"), wickDownColor: C("--down")
  });
  candle.priceScale().applyOptions({ scaleMargins: { top: 0.08, bottom: 0.28 } });
  const vol = chart.addHistogramSeries({ priceScaleId: "", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  vol.priceScale().applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
  const ma = MA_COLORS.map((_, k) => chart.addLineSeries(lineOpts(maColor(k))));
  const bbs = [0, 1, 2].map(i => chart.addLineSeries({ ...lineOpts(bbColor()), lineStyle: i === 1 ? 2 : 0 }));
  const P = { el, chart, candle, vol, ma, bbs, bars: [], vols: [], ind: null, hlines: [], lbl: el.querySelector(".lbl"), last: null, hover: false, loadingOld: false, noMore: false };
  P.trend = new TrendLines(P, b);
  candle.attachPrimitive(P.trend);
  chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && r.from < 60) loadOlder(P, b, gen) });
  chart.subscribeCrosshairMove(p => {
    const c = p.time && p.seriesData.get(candle), v = p.time && p.seriesData.get(vol);
    P.hover = !!c;
    if (c) renderLbl(b, idxOfTime(P.bars, p.time), `시 ${fp(c.open)} 고 ${fp(c.high)} 저 ${fp(c.low)} 종 ${fp(c.close)} · 량 ${v ? fv(v.value) : "-"}`);
    else showLbl(b);
    if (mode === "t" && pending && p.point) { preview = pointToTP(P, b, p.point) || preview; repaint() }
  });
  chart.subscribeClick(p => onChartClick(P, b, p));
  const box = el.querySelector(".c");
  box.addEventListener("pointerdown", e => onPointerDown(P, b, box, e), true);
  box.addEventListener("mousedown", e => { if (drag) e.stopPropagation() }, true);
  box.addEventListener("pointermove", e => { if (!drag && !mode) setHoverCursor(P, b, box, e) });
  panes[b] = P;
}

function renderLbl(b, i, text) {
  const P = panes[b], parts = [];
  ind.ma.forEach((m, k) => {
    if (!m.on) return;
    const v = P.ind?.ma[k]?.[i];
    parts.push(`<span style="color:${maColor(k)}">${m.type}${m.n} ${v == null ? "-" : fp(v)}</span>`);
  });
  if (ind.bb.on) {
    const u = P.ind?.bb?.[0][i], l = P.ind?.bb?.[2][i];
    parts.push(`<span style="color:${bbColor()}">BB ${u == null ? "-" : fp(u)} / ${l == null ? "-" : fp(l)}</span>`);
  }
  P.lbl.innerHTML = `<div><b>${b}</b>${text}</div>` + (parts.length ? `<div class="ind">${parts.join("")}</div>` : "");
}

function showLbl(b) {
  const P = panes[b];
  renderLbl(b, P.bars.length - 1, P.last ? `거래량 ${fv(+P.last[volIdx()])}` : "");
}

function paintInd(P, full) {
  const cl = P.bars.map(x => x.close), vl = P.vols.map(x => x.value);
  P.ind = {
    ma: ind.ma.map(m => !m.on ? null : m.type === "EMA" ? ema(cl, m.n) : m.type === "VWMA" ? vwma(cl, vl, m.n) : sma(cl, m.n)),
    bb: ind.bb.on ? bollinger(cl, ind.bb.n, ind.bb.k) : null
  };
  const n = P.bars.length;
  const pt = (arr, j) => arr[j] == null ? { time: P.bars[j].time } : { time: P.bars[j].time, value: arr[j] };
  const apply = (s, arr) => {
    if (!arr) { if (full) s.setData([]); return }
    if (full) s.setData(P.bars.map((_, j) => pt(arr, j)));
    else if (n) s.update(pt(arr, n - 1));
  };
  P.ma.forEach((s, k) => apply(s, P.ind.ma[k]));
  P.bbs.forEach((s, k) => apply(s, P.ind.bb && P.ind.bb[k]));
}

function repaint() { for (const b of BARS) panes[b].trend.requestUpdate?.() }

function loadDrawings() {
  try { drawings = JSON.parse(store.get("okx.draw." + inst, "[]")) } catch (e) { drawings = [] }
}

function saveDrawings() {
  store.set("okx.draw." + inst, JSON.stringify(drawings));
  updateClearBtn();
}

function syncDrawings() {
  for (const b of BARS) {
    const P = panes[b];
    P.hlines.forEach(l => P.candle.removePriceLine(l));
    P.hlines = drawings.filter(d => d.type === "h").map(d =>
      P.candle.createPriceLine({ price: d.price, color: C("--draw"), lineWidth: d === selected ? 2 : 1, lineStyle: 0, axisLabelVisible: true, title: "" }));
  }
  repaint();
}

const HINTS = {
  h: "수평선: 차트를 클릭하면 그 가격에 선이 생깁니다 · Esc 취소",
  t: "추세선: 시작점과 끝점을 차례로 클릭하세요 · Esc 취소",
  sel: "선택됨: 끌어서 옮기고 Backspace 로 지웁니다 · Esc 선택 해제"
};

function updateHint() {
  const h = mode ? HINTS[mode] : selected ? HINTS.sel : "";
  $("hint").textContent = h;
  document.body.classList.toggle("hinting", !!h);
}

function setMode(m) {
  mode = m; pending = null; preview = null;
  if (m) selected = null;
  document.body.classList.toggle("drawing", !!m);
  document.querySelectorAll(".tool[data-mode]").forEach(x => x.classList.toggle("active", x.dataset.mode === m));
  updateHint();
  syncDrawings();
}

function select(d) {
  if (selected === d) return;
  selected = d;
  updateHint();
  syncDrawings();
}

function deleteSelected() {
  drawings = drawings.filter(x => x !== selected);
  selected = null;
  saveDrawings();
  updateHint();
  syncDrawings();
}

function hitTest(P, b, pt) {
  let best = null, bestD = 7;
  for (const d of drawings) {
    if (d.type === "h") {
      const y = P.candle.priceToCoordinate(d.price);
      const dist = y == null ? Infinity : Math.abs(y - pt.y);
      if (dist < bestD) { bestD = dist; best = { d, part: "h" } }
      continue;
    }
    const r = rayXY(P, b, d, P.trend.width || 10000);
    if (!r) continue;
    r.anchors.forEach(([x, y], i) => {
      const dist = Math.hypot(x - pt.x, y - pt.y) - 3;
      if (dist < bestD) { bestD = dist; best = { d, part: i ? "a2" : "a1" } }
    });
    const dist = distToSeg(pt.x, pt.y, r.seg);
    if (dist < bestD) { bestD = dist; best = { d, part: "body" } }
  }
  return best;
}

function localPt(box, e) {
  const r = box.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function setHoverCursor(P, b, box, e) {
  const pt = localPt(box, e), part = pt.x <= P.trend.width ? hitTest(P, b, pt)?.part : null;
  box.classList.toggle("hov-ns", part === "h");
  box.classList.toggle("hov-pt", part === "a1" || part === "a2");
  box.classList.toggle("hov-move", part === "body");
}

function onPointerDown(P, b, box, e) {
  if (mode || e.button !== 0) return;
  const pt = localPt(box, e);
  if (pt.x > P.trend.width) return;
  const hit = hitTest(P, b, pt);
  if (!hit) { if (selected) select(null); return }
  e.stopPropagation();
  select(hit.d);
  drag = { P, b, box, d: hit.d, part: hit.part, orig: { ...hit.d }, tp0: pointToTP(P, b, pt), moved: false };
}

function moveHline(d) {
  const i = drawings.filter(x => x.type === "h").indexOf(d);
  for (const b of BARS) panes[b].hlines[i]?.applyOptions({ price: d.price });
}

window.addEventListener("pointermove", e => {
  if (!drag) return;
  const { P, b, box, d, part, orig, tp0 } = drag;
  const tp = pointToTP(P, b, localPt(box, e));
  if (!tp || !tp0) return;
  drag.moved = true;
  if (part === "h") { d.price = tp.p; moveHline(d); return }
  if (part === "a1") { d.t1 = tp.t; d.p1 = tp.p }
  else if (part === "a2") { d.t2 = tp.t; d.p2 = tp.p }
  else {
    const dt = tp.t - tp0.t, dp = tp.p - tp0.p;
    d.t1 = orig.t1 + dt; d.t2 = orig.t2 + dt;
    d.p1 = +(orig.p1 + dp).toFixed(pricePrec); d.p2 = +(orig.p2 + dp).toFixed(pricePrec);
  }
  repaint();
});

window.addEventListener("pointerup", () => {
  if (!drag) return;
  const moved = drag.moved;
  drag = null;
  if (moved) saveDrawings();
});

function onChartClick(P, b, param) {
  if (!mode || !param.point) return;
  const tp = pointToTP(P, b, param.point);
  if (!tp) return;
  let d;
  if (mode === "h") {
    d = { type: "h", price: tp.p };
  } else if (!pending) {
    pending = tp; preview = tp; repaint();
    return;
  } else {
    d = { type: "t", t1: pending.t, p1: pending.p, t2: tp.t, p2: tp.p };
  }
  drawings.push(d);
  saveDrawings();
  setMode(null);
  select(d);
}

function applyView() {
  document.querySelectorAll("nav button[data-v]").forEach(x => x.classList.toggle("active", shown.includes(x.dataset.v)));
  for (const b of BARS) panes[b].el.classList.toggle("hidden", !shown.includes(b));
  store.set("okx.shown", JSON.stringify(shown));
}

function setDot(on) { $("dot").classList.toggle("on", on) }

async function getJson(url) {
  const j = await (await fetch(url)).json();
  if (j.code !== "0") throw new Error(j.msg || "code " + j.code);
  return j.data;
}

async function refreshTicker(g) {
  try {
    const t = (await getJson(`${API}/market/ticker?instId=${inst}`))[0];
    if (g !== gen) return;
    const last = +t.last, open = +t.open24h, pct = (last - open) / open * 100;
    $("price").textContent = fp(last);
    $("chg").textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
    $("chg").style.color = pct >= 0 ? C("--up") : C("--down");
  } catch (e) {}
}

async function load() {
  const g = ++gen;
  clearInterval(pingT); clearTimeout(retryT); clearInterval(tickT);
  if (ws) { ws.onclose = null; ws.close(); ws = null }
  setDot(false);
  selected = null;
  drag = null;
  setMode(null);
  $("sym").value = inst;
  document.title = inst;
  loadDrawings();
  updateClearBtn();
  try {
    const type = /-SWAP$/.test(inst) ? "SWAP" : /-\d{6}$/.test(inst) ? "FUTURES" : "SPOT";
    const tick = (await getJson(`${API}/public/instruments?instType=${type}&instId=${inst}`))[0].tickSz;
    pricePrec = (tick.split(".")[1] || "").length;
    for (const b of BARS) panes[b].candle.applyOptions({ priceFormat: { type: "price", precision: pricePrec, minMove: +tick } });
    await Promise.all(BARS.map(async b => {
      const rows = (await getJson(`${API}/market/candles?instId=${inst}&bar=${OKX_BAR[b]}&limit=300`)).slice().reverse();
      if (g !== gen) return;
      const P = panes[b], bars = rows.map(toBar);
      P.bars = bars.map(x => x[0]);
      P.vols = bars.map(x => x[1]);
      P.noMore = false;
      P.candle.setData(P.bars);
      P.vol.setData(P.vols);
      paintInd(P, true);
      P.last = rows.at(-1);
      showLbl(b);
      P.chart.timeScale().scrollToRealTime();
    }));
  } catch (e) {
    if (g !== gen) return;
    $("price").textContent = "조회 실패";
    $("chg").textContent = e.message;
    $("chg").style.color = C("--muted");
    retryT = setTimeout(load, 10000);
    return;
  }
  if (g !== gen) return;
  syncDrawings();
  refreshTicker(g);
  tickT = setInterval(() => refreshTicker(g), 10000);
  connect(g);
  warmup(g);
}

const WARMUP_BARS = 1000;

async function warmup(g) {
  for (const b of [...shown, ...BARS.filter(x => !shown.includes(x))]) {
    const P = panes[b];
    while (g === gen && !P.noMore && P.bars.length < WARMUP_BARS) {
      const before = P.bars.length;
      await loadOlder(P, b, g);
      if (P.bars.length === before) break;
      await new Promise(r => setTimeout(r, 150));
    }
  }
}

async function loadOlder(P, b, g) {
  if (P.loadingOld || P.noMore || !P.bars.length || g !== gen) return;
  P.loadingOld = true;
  try {
    const oldest = (P.bars[0].time - TZ) * 1000;
    const rows = (await getJson(`${API}/market/history-candles?instId=${inst}&bar=${OKX_BAR[b]}&after=${oldest}&limit=300`)).slice().reverse();
    if (g !== gen) return;
    const add = rows.map(toBar).filter(x => x[0].time < P.bars[0].time);
    if (!add.length) { P.noMore = true; return }
    const range = P.chart.timeScale().getVisibleLogicalRange();
    P.bars = add.map(x => x[0]).concat(P.bars);
    P.vols = add.map(x => x[1]).concat(P.vols);
    P.candle.setData(P.bars);
    P.vol.setData(P.vols);
    paintInd(P, true);
    if (range) P.chart.timeScale().setVisibleLogicalRange({ from: range.from + add.length, to: range.to + add.length });
    repaint();
  } catch (e) {
  } finally {
    P.loadingOld = false;
  }
}

function connect(g) {
  const s = new WebSocket("wss://ws.okx.com/ws/v5/business");
  ws = s;
  s.onopen = () => {
    s.send(JSON.stringify({ op: "subscribe", args: BARS.map(b => ({ channel: "candle" + OKX_BAR[b], instId: inst })) }));
    setDot(true);
    pingT = setInterval(() => s.readyState === 1 && s.send("ping"), 20000);
  };
  s.onmessage = e => {
    if (e.data === "pong") return;
    const m = JSON.parse(e.data);
    if (!m.data || !m.arg || m.arg.instId !== inst) return;
    const b = BAR_OF[m.arg.channel.slice(6)], P = panes[b];
    if (!P) return;
    for (const r of m.data) {
      const [c, v] = toBar(r);
      try { P.candle.update(c); P.vol.update(v) } catch (err) { continue }
      if (P.bars.length && P.bars[P.bars.length - 1].time === c.time) { P.bars[P.bars.length - 1] = c; P.vols[P.vols.length - 1] = v }
      else { P.bars.push(c); P.vols.push(v) }
      paintInd(P, false);
      P.last = r;
      if (!P.hover) showLbl(b);
      if (b === "1m") $("price").textContent = fp(+r[4]);
    }
  };
  s.onclose = () => {
    setDot(false);
    clearInterval(pingT);
    if (g === gen) retryT = setTimeout(load, 3000);
  };
  s.onerror = () => s.close();
}

async function resolveInst(v) {
  if (v.includes("-")) return v;
  for (const id of [v + "-USDT", v + "-USDT-SWAP", "X" + v + "-USDT"]) {
    try { if ((await getJson(`${API}/market/ticker?instId=${id}`)).length) return id } catch (e) {}
  }
  return v + "-USDT";
}

let universe = [], uniP = null, uniAt = 0, sugg = [], selIdx = 0;
const symEl = $("sym"), suggEl = $("sugg");

function loadUniverse() {
  if (uniP && Date.now() - uniAt < 300000) return uniP;
  uniAt = Date.now();
  uniP = (async () => {
    const [sp, sw] = await Promise.all(["SPOT", "SWAP"].map(t => getJson(`${API}/market/tickers?instType=${t}`).catch(() => [])));
    const quote = id => id.split("-")[1] || "";
    universe = [
      ...sp.map(t => ({ id: t.instId, type: "현물", last: +t.last, open: +t.open24h, usd: /^USD/.test(quote(t.instId)) ? +t.volCcy24h : 0 })),
      ...sw.map(t => ({ id: t.instId, type: "무기한", last: +t.last, open: +t.open24h, usd: +t.volCcy24h * +t.last }))
    ];
    for (const u of universe) u.base = u.id.split("-")[0];
    if (!universe.length) uniAt = 0;
    return universe;
  })();
  return uniP;
}

function search(q) {
  q = q.trim().toUpperCase();
  if (!q) return [];
  const tier = u =>
    u.id === q ? 0 :
    u.base === q || u.base === "X" + q ? 1 :
    u.base.startsWith(q) || u.base.startsWith("X" + q) ? 2 :
    u.id.includes(q) ? 3 : 9;
  return universe.map(u => [tier(u), u]).filter(x => x[0] < 9)
    .sort((a, b) => a[0] - b[0] || b[1].usd - a[1].usd)
    .slice(0, 15).map(x => x[1]);
}

function renderSugg(show) {
  if (!show) { suggEl.classList.remove("open"); return }
  suggEl.innerHTML = sugg.length ? sugg.map((u, i) => {
    const pc = u.open ? (u.last - u.open) / u.open * 100 : 0;
    return `<div class="it${i === selIdx ? " sel" : ""}" data-i="${i}"><span class="id">${u.id}</span><span class="tag">${u.type}</span>` +
      `<span class="px">${u.last.toLocaleString("en-US", { maximumSignificantDigits: 6 })}</span>` +
      `<span class="pc" style="color:${pc >= 0 ? C("--up") : C("--down")}">${pc >= 0 ? "+" : ""}${pc.toFixed(2)}%</span></div>`;
  }).join("") : '<div class="it empty">일치하는 종목 없음</div>';
  suggEl.classList.add("open");
}

function closeSugg() { sugg = []; renderSugg(false) }

function pick(id) {
  inst = id;
  store.set("okx.inst", inst);
  closeSugg();
  symEl.blur();
  load();
}

symEl.addEventListener("focus", () => { symEl.select(); loadUniverse() });
symEl.addEventListener("blur", () => { closeSugg(); symEl.value = inst });
symEl.addEventListener("input", async () => {
  await loadUniverse();
  sugg = search(symEl.value);
  selIdx = 0;
  renderSugg(!!symEl.value.trim());
});
symEl.addEventListener("keydown", async e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!sugg.length) return;
    e.preventDefault();
    selIdx = (selIdx + (e.key === "ArrowDown" ? 1 : -1) + sugg.length) % sugg.length;
    renderSugg(true);
    suggEl.children[selIdx]?.scrollIntoView({ block: "nearest" });
    return;
  }
  if (e.key === "Escape") { symEl.blur(); return }
  if (e.key !== "Enter") return;
  const v = symEl.value.trim().toUpperCase();
  if (!v) return;
  pick(sugg[selIdx]?.id || await resolveInst(v));
});
suggEl.addEventListener("mousedown", e => {
  const it = e.target.closest(".it[data-i]");
  if (!it) return;
  e.preventDefault();
  pick(sugg[+it.dataset.i].id);
});

document.querySelectorAll("nav button[data-v]").forEach(btn => {
  const b = btn.dataset.v;
  btn.title = "클릭: 켜고 끄기 · 더블클릭: 이것만 보기";
  btn.onclick = () => {
    if (shown.includes(b)) { if (shown.length > 1) shown = shown.filter(x => x !== b) }
    else shown = BARS.filter(x => x === b || shown.includes(x));
    applyView();
  };
  btn.ondblclick = () => { shown = [b]; applyView() };
});

document.querySelectorAll(".tool[data-mode]").forEach(btn => {
  btn.onclick = () => setMode(mode === btn.dataset.mode ? null : btn.dataset.mode);
});

const indp = $("indp");

function buildIndPanel() {
  const sel = t => ["SMA", "EMA", "VWMA"].map(x => `<option${t === x ? " selected" : ""}>${x}</option>`).join("");
  indp.innerHTML = ind.ma.map((m, k) =>
    `<div class="row"><label><input type="checkbox" data-f="on" data-k="${k}"${m.on ? " checked" : ""}></label><input type="color" data-f="color" data-k="${k}" value="${maColor(k)}" title="선 색">` +
    `<select data-f="type" data-k="${k}">${sel(m.type)}</select><input type="number" min="1" max="300" data-f="n" data-k="${k}" value="${m.n}"></div>`).join("") +
    `<div class="row"><label><input type="checkbox" data-f="bbon"${ind.bb.on ? " checked" : ""}></label><input type="color" data-f="bbcolor" value="${bbColor()}" title="선 색">` +
    `<span class="nm">볼린저</span><input type="number" min="2" max="300" data-f="bbn" value="${ind.bb.n}" title="기간"><input type="number" min="0.5" max="5" step="0.5" data-f="bbk" value="${ind.bb.k}" title="표준편차 배수"></div>` +
    `<div class="foot"><button id="clrDraw"></button></div>`;
  updateClearBtn();
}

function updateClearBtn() {
  const btn = $("clrDraw");
  if (!btn) return;
  btn.textContent = `${inst} 그린 선 모두 지우기 (${drawings.length})`;
  btn.disabled = !drawings.length;
}

const clampInt = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d };

function onColor(e) {
  const t = e.target, f = t.dataset.f;
  if (f === "color") ind.ma[+t.dataset.k].color = t.value;
  else if (f === "bbcolor") ind.bb.color = t.value;
  else return false;
  store.set("okx.ind", JSON.stringify(ind));
  for (const b of BARS) {
    const P = panes[b];
    P.ma.forEach((s, k) => s.applyOptions({ color: maColor(k) }));
    P.bbs.forEach(s => s.applyOptions({ color: bbColor() }));
    if (!P.hover) showLbl(b);
  }
  return true;
}

indp.addEventListener("input", onColor);

indp.addEventListener("change", e => {
  if (onColor(e)) return;
  const t = e.target, f = t.dataset.f, k = +t.dataset.k;
  if (f === "on") ind.ma[k].on = t.checked;
  else if (f === "type") ind.ma[k].type = t.value;
  else if (f === "n") t.value = ind.ma[k].n = clampInt(t.value, 1, 300, ind.ma[k].n);
  else if (f === "bbon") ind.bb.on = t.checked;
  else if (f === "bbn") t.value = ind.bb.n = clampInt(t.value, 2, 300, ind.bb.n);
  else if (f === "bbk") { const v = +t.value; t.value = ind.bb.k = Number.isFinite(v) ? Math.max(0.5, Math.min(5, v)) : ind.bb.k }
  else return;
  store.set("okx.ind", JSON.stringify(ind));
  for (const b of BARS) { paintInd(panes[b], true); if (!panes[b].hover) showLbl(b) }
});

indp.addEventListener("click", e => {
  if (e.target.id !== "clrDraw" || !drawings.length) return;
  drawings = [];
  selected = null;
  updateHint();
  saveDrawings();
  syncDrawings();
});

$("indBtn").onclick = () => {
  const open = !indp.classList.contains("open");
  if (open) buildIndPanel();
  indp.classList.toggle("open", open);
  $("indBtn").classList.toggle("active", open);
};

document.addEventListener("mousedown", e => {
  if (!indp.classList.contains("open") || indp.contains(e.target) || e.target === $("indBtn")) return;
  indp.classList.remove("open");
  $("indBtn").classList.remove("active");
});

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
  if ((e.key === "Backspace" || e.key === "Delete") && selected && !typing) {
    e.preventDefault();
    deleteSelected();
    return;
  }
  if (e.key !== "Escape" || document.activeElement === symEl) return;
  setMode(null);
  select(null);
  indp.classList.remove("open");
  $("indBtn").classList.remove("active");
});

applyView();
load();
</script>
</body>
